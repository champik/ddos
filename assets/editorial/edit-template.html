<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DDOS Editorial</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0e0e10;color:#f4f0e6;font-family:'Space Grotesk',system-ui,sans-serif;font-size:13px;padding:20px}
h1{font-family:Anton,Impact,sans-serif;font-size:26px;color:#f5ff3d;letter-spacing:1px;margin-bottom:3px}
.meta{color:#666;font-size:11px;font-family:monospace;margin-bottom:18px}
.topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid #2a2a2f}
.badges{display:flex;gap:7px;flex-wrap:wrap;margin-top:6px}
.badge{background:#1a1a1f;border:1px solid #2a2a2f;border-radius:6px;padding:3px 9px;font-size:11px;color:#888}
.badge span{color:#f5ff3d}
.badge.dur{border-color:#4ade8044}.badge.dur span{color:#4ade80;font-size:13px;font-weight:700}
.btn-copy{background:#f5ff3d;color:#0e0e10;border:none;border-radius:8px;padding:10px 18px;font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap;flex-shrink:0}
.clip-card{background:#13131a;border:1px solid #2a2a2f;border-radius:10px;overflow:hidden;margin-bottom:6px}
.clip-card.sortable-ghost{opacity:0.3}
.card-header{display:flex;align-items:center;gap:9px;padding:9px 13px;cursor:pointer;user-select:none}
.drag-handle{color:#2a2a3a;font-size:16px;cursor:grab;flex-shrink:0}
.drag-handle:active{cursor:grabbing}
.clip-num{color:#f5ff3d;font-family:monospace;font-weight:700;min-width:20px;font-size:12px}
.clip-streamer{font-weight:600;font-size:14px}
.clip-cat{color:#555;font-size:11px}
.clip-dur-display{color:#888;font-family:monospace;font-size:11px}
.clip-score{background:#f5ff3d18;color:#f5ff3d;border-radius:4px;padding:2px 6px;font-size:11px;font-family:monospace}
.card-tags{display:flex;gap:5px;margin-left:auto;align-items:center}
.tag{border-radius:20px;padding:2px 9px;font-size:10px;font-weight:700;opacity:0.28;border:1px solid currentColor;cursor:pointer;letter-spacing:.3px;transition:opacity .12s}
.tag:hover{opacity:.65}.tag.on{opacity:1}
.tag-short{color:#a78bfa}.tag-thumb{color:#4ade80}.tag-reconnect{color:#ff6b6b}
.mini-badge{font-size:10px;padding:2px 6px;border-radius:4px;font-family:monospace}
.mb-cut{background:#ff4a4a15;color:#ff6b6b}
.mb-thumb{background:#4ade8015;color:#4ade80}
.expand-icon{color:#2a2a3a;font-size:11px;margin-left:4px;flex-shrink:0}
.card-body{padding:13px;border-top:1px solid #1a1a22;display:none}
.card-body.open{display:block}
.video-wrap{background:#000;border-radius:8px;aspect-ratio:16/9;width:100%;overflow:hidden;position:relative}
.video-wrap video{width:100%;height:100%;display:block}
.play-mode-row{display:flex;gap:6px;margin-top:7px;align-items:center}
.play-mode-btn{background:#1a1a24;border:1px solid #2a2a2f;border-radius:6px;padding:4px 10px;color:#666;font-size:11px;cursor:pointer}
.play-mode-btn.active{border-color:#f5ff3d;color:#f5ff3d;background:#f5ff3d0e}
.playpos{color:#666;font-family:monospace;font-size:11px;margin-left:auto}
.tl-wrap{margin-top:10px}
.tl-label{display:flex;justify-content:space-between;font-size:10px;color:#555;margin-bottom:4px}
.tl-track{height:34px;background:#161620;border-radius:6px;position:relative;cursor:pointer}
.tl-fill{position:absolute;top:0;height:100%;background:#f5ff3d14;border-radius:4px;pointer-events:none}
.tl-cut-zone{position:absolute;top:0;height:100%;background:repeating-linear-gradient(45deg,#ff4a4a22,#ff4a4a22 3px,transparent 3px,transparent 8px);border:1px solid #ff4a4a44;border-radius:3px;pointer-events:none}
.tl-handle{position:absolute;top:-4px;width:12px;height:42px;background:#f5ff3d;border-radius:3px;cursor:ew-resize;transform:translateX(-50%)}
.tl-handle-out{transform:translateX(50%)}
.tl-playhead{position:absolute;top:-5px;width:2px;height:44px;background:#fff;opacity:.45;pointer-events:none}
.tl-times{display:flex;justify-content:space-between;font-size:10px;color:#666;margin-top:4px;font-family:monospace}
.ctrl-row{display:flex;gap:7px;margin-top:9px;align-items:center;flex-wrap:wrap}
.ctrl-lbl{color:#555;font-size:11px}
.ctrl-in{background:#1a1a24;border:1px solid #2a2a2f;border-radius:5px;padding:4px 7px;color:#f4f0e6;font-size:11px;font-family:monospace;width:68px}
.ctrl-btn{background:#1a1a24;border:1px solid #2a2a2f;border-radius:6px;padding:4px 11px;color:#888;font-size:11px;cursor:pointer}
.ctrl-btn:hover{border-color:#f5ff3d55;color:#f4f0e6}
.ctrl-btn.red{border-color:#ff4a4a33;color:#ff6b6b}
.sec{border-radius:8px;padding:11px;margin-top:9px}
.sec.reconnect{background:#160a0a;border:1px solid #ff4a4a2a}
.sec.thumb{background:#0a160a;border:1px solid #4ade802a}
.sec.shorts{background:#100e1a;border:1px solid #a78bfa2a}
.sec-title{font-size:11px;font-weight:700;margin-bottom:9px}
.sec-title.red{color:#ff6b6b}.sec-title.green{color:#4ade80}.sec-title.purple{color:#a78bfa}
.mode-row{display:flex;gap:7px;margin-bottom:10px}
.mode-btn{flex:1;background:#1a1824;border:1px solid #2a2a2f;border-radius:8px;padding:7px 5px;text-align:center;cursor:pointer}
.mode-btn.active{border-color:#a78bfa;background:#a78bfa14}
.mode-icon{font-size:17px;display:block;margin-bottom:2px}
.mode-lbl{font-size:10px;color:#666}
.mode-btn.active .mode-lbl{color:#a78bfa}
.split-editor{display:grid;grid-template-columns:1fr 168px;gap:14px;align-items:start}
.split-canvas{position:relative;aspect-ratio:16/9;background:linear-gradient(135deg,#0a0a12,#12122a);border-radius:6px;overflow:visible}
.split-canvas video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:6px;pointer-events:none}
.drag-box{position:absolute;border-radius:4px;cursor:move}
.cam-box-el{border:2px solid #f5ff3d;background:rgba(245,255,61,.07)}
.game-box-el{border:2px solid #4ade80;background:rgba(74,222,128,.06)}
.box-label{position:absolute;top:-17px;left:0;font-size:9px;background:#0e0e10;padding:1px 5px;border-radius:3px;white-space:nowrap;pointer-events:none}
.cam-box-el .box-label{color:#f5ff3d}
.game-box-el .box-label{color:#4ade80}
.resize-handle{position:absolute;bottom:-5px;right:-5px;width:9px;height:9px;background:#f5ff3d;border-radius:50%;cursor:se-resize}
.coord-hint{font-size:10px;color:#333;font-family:monospace;margin-top:5px}
.preview-col{display:flex;flex-direction:column;align-items:center;gap:6px}
.preview-lbl{font-size:10px;color:#444;font-family:monospace}
.sp-phone{width:160px;height:284px;background:#000;border-radius:14px;overflow:hidden;border:2px solid #222;display:flex;flex-direction:column}
.sp-cam{background:#0a160a;display:flex;align-items:center;justify-content:center;font-size:10px;color:#4ade8055;cursor:grab;user-select:none;position:relative;flex-shrink:0}
.sp-cam::after{content:'↕';position:absolute;top:3px;right:5px;font-size:9px;color:#4ade8044}
.sp-div{height:3px;background:#f5ff3d;flex-shrink:0}
.sp-game{flex:1;background:linear-gradient(135deg,#0a0a12,#12122a);display:flex;align-items:center;justify-content:center;font-size:10px;color:#4444aa55}
.drag-tip{font-size:9px;color:#2a2a3a;text-align:center;width:160px;line-height:1.5}
.recon-sep{display:flex;align-items:center;gap:8px;padding:6px 13px;background:#150808;border:1px solid #ff4a4a33;border-radius:8px;margin:5px 0;cursor:grab}
.recon-sep.sortable-ghost{opacity:0.3}
.recon-sep-icon{color:#ff6b6b;font-size:15px;flex-shrink:0}
.recon-sep-info{flex:1}
.recon-sep-title{font-size:11px;color:#ff6b6b;font-weight:700}
.recon-sep-detail{font-size:10px;color:#662222;font-family:monospace;margin-top:1px}
.recon-sep-move{font-size:10px;color:#441111;cursor:pointer}
.recon-sep-move:hover{color:#ff6b6b}
.bench-wrap{margin-top:16px}
.bench-toggle{display:flex;align-items:center;gap:8px;padding:8px 13px;background:#0e0e16;border:1px solid #1e1e28;border-radius:8px;cursor:pointer;font-size:12px;color:#666}
.bench-toggle:hover{color:#aaa;border-color:#2a2a3a}
.bench-body{display:none;margin-top:8px}
.bench-body.open{display:block}
.bench-cat{margin-bottom:14px}
.bench-cat-title{font-size:10px;color:#555;font-family:monospace;font-weight:700;margin-bottom:6px;padding:0 2px}
.bench-cards{display:flex;flex-wrap:wrap;gap:6px}
.bench-card{background:#13131a;border:1px solid #222;border-radius:8px;padding:8px 10px;display:flex;align-items:center;gap:8px;cursor:grab;min-width:200px}
.bench-card:hover{border-color:#2a2a3a}
.bench-card.sortable-ghost{opacity:0.3}
.bench-streamer{font-weight:600;font-size:13px;flex:1}
.bench-score{color:#f5ff3d;font-size:11px;font-family:monospace}
.bench-dur{color:#555;font-size:11px;font-family:monospace}
.bench-add{background:#1a1a24;border:1px solid #2a2a2f;border-radius:5px;padding:3px 9px;color:#888;font-size:11px;cursor:pointer;flex-shrink:0}
.bench-add:hover{border-color:#f5ff3d55;color:#f4f0e6}
.prompt-block{background:#0a0a14;border:1px solid #1e1e28;border-radius:10px;padding:14px;margin-top:18px}
.prompt-title{color:#f5ff3d;font-size:11px;font-family:monospace;font-weight:700;margin-bottom:9px}
.prompt-code{font-family:monospace;font-size:11px;color:#6aaa6a;line-height:1.75;white-space:pre;overflow-x:auto;max-height:300px}
.prompt-actions{display:flex;gap:8px;margin-top:11px}
.btn-copy-json{background:transparent;border:1px solid #f5ff3d;color:#f5ff3d;border-radius:6px;padding:7px 15px;font-size:12px;cursor:pointer}
</style>
</head>
<body>
<div style="max-width:900px;margin:0 auto" id="app">
  <div class="topbar">
    <div>
      <h1>EDITORIAL</h1>
      <div class="meta" id="meta-line">Loading...</div>
      <div class="badges" id="badges">
        <div class="badge dur">Episode: <span id="dur-display">—</span></div>
        <div class="badge">кліпів: <span id="count-display">0</span></div>
        <div class="badge">shorts: <span id="shorts-display">0</span></div>
        <div class="badge" id="reconnect-badge" style="display:none">reconnect: <span id="reconnect-display">—</span></div>
        <div class="badge" id="thumb-badge" style="display:none">thumb: <span id="thumb-display">—</span></div>
      </div>
    </div>
    <button class="btn-copy" onclick="copyPrompt()">📋 Copy Prompt</button>
  </div>
  <div id="clip-list"></div>
  <div class="bench-wrap">
    <div class="bench-toggle" onclick="toggleBench(this)">
      <span id="bench-arrow">▶</span>
      <span id="bench-label">Bench — завантаження...</span>
    </div>
    <div class="bench-body" id="bench-body"></div>
  </div>
  <div class="prompt-block">
    <div class="prompt-title">// GENERATED PROMPT</div>
    <div class="prompt-code" id="prompt-code">{}</div>
    <div class="prompt-actions">
      <button class="btn-copy-json" onclick="copyPrompt()">📋 Copy JSON</button>
    </div>
  </div>
</div>

<script>
const CLIPS_DATA = __CLIPS_JSON__;
</script>

<script>
// ── STATE ─────────────────────────────────────────────────────────────────────
const STATE_KEY = 'ddos_editorial_' + CLIPS_DATA.runId;
const CAM_KEY = 'ddos_cam_coords';

let state = { order: [], reconnect: null, thumbnail: null, clips: {} };

function saveState() { localStorage.setItem(STATE_KEY, JSON.stringify(state)); updatePrompt(); updateTopbar(); }

function loadState() {
  const saved = localStorage.getItem(STATE_KEY);
  if (saved) { try { state = JSON.parse(saved); return true; } catch(e) {} }
  return false;
}

function allClips() { return [...CLIPS_DATA.selected, ...CLIPS_DATA.bench]; }
function getClip(id) { return allClips().find(c => c.id === id); }
function getClipState(id) { if (!state.clips[id]) state.clips[id] = {}; return state.clips[id]; }

function fmtTime(sec) {
  const m = Math.floor(sec / 60);
  const s = (sec % 60).toFixed(1).padStart(4, '0');
  return m + ':' + s;
}
function fmtTimeSec(sec) {
  const m = Math.floor(sec / 60);
  const s = Math.round(sec % 60).toString().padStart(2, '0');
  return m + ':' + s;
}

// ── INIT ──────────────────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
  const hadSaved = loadState();
  if (!hadSaved || state.order.length === 0) {
    state.order = CLIPS_DATA.selected.map(c => c.id);
    state.clips = {};
  }
  document.getElementById('meta-line').textContent =
    CLIPS_DATA.runId + ' · ' + allClips().length + ' кліпів scored';
  renderClipList();
  renderBench();
  updateTopbar();
  updatePrompt();
});

// ── RENDER CLIP LIST ──────────────────────────────────────────────────────────
function renderClipList() {
  const container = document.getElementById('clip-list');
  container.innerHTML = '';
  state.order.forEach((clipId, idx) => {
    const clip = getClip(clipId);
    if (!clip) return;
    container.appendChild(buildClipCard(clip, idx + 1));
    if (state.reconnect && state.reconnect.afterIndex === idx) {
      container.appendChild(buildReconSep());
    }
  });
  if (!state.reconnect && state.order.length > 0) {
    const firstCard = container.querySelector('.clip-card');
    if (firstCard && firstCard.nextSibling) {
      container.insertBefore(buildReconSep(), firstCard.nextSibling);
    }
  }
  initSortable();
}

function buildClipCard(clip, num) {
  const cs = getClipState(clip.id);
  const isShort = !!(cs.short);
  const isThumb = state.thumbnail && state.thumbnail.clipId === clip.id;
  const isRecon = state.reconnect && state.reconnect.clipId === clip.id;
  const cutCount = (cs.cuts || []).length;
  const card = document.createElement('div');
  card.className = 'clip-card';
  card.dataset.clipId = clip.id;
  card.innerHTML = `
    <div class="card-header" onclick="toggleCard(event,this)">
      <span class="drag-handle" data-handle="true">⠿⠿</span>
      <span class="clip-num">#${num}</span>
      <span class="clip-streamer">${clip.streamer}</span>
      <span class="clip-cat">· ${clip.category}</span>
      <span class="clip-dur-display">${fmtTimeSec(clip.duration)}</span>
      <span class="clip-score">${clip.ddosScore}</span>
      <div class="card-tags">
        <span class="tag tag-short ${isShort?'on':''}" data-tag="short" onclick="toggleTag(event,'${clip.id}','short')">SHORT</span>
        <span class="tag tag-thumb ${isThumb?'on':''}" data-tag="thumb" onclick="toggleTag(event,'${clip.id}','thumb')">THUMB</span>
        <span class="tag tag-reconnect ${isRecon?'on':''}" data-tag="reconnect" onclick="toggleTag(event,'${clip.id}','reconnect')">RECONNECT</span>
        ${cutCount > 0 ? `<span class="mini-badge mb-cut">✂ ${cutCount}</span>` : ''}
        ${isThumb ? `<span class="mini-badge mb-thumb">🖼 ${fmtTimeSec(state.thumbnail.at)}</span>` : ''}
      </div>
      <span class="expand-icon">▼</span>
    </div>
    <div class="card-body" id="body-${clip.id}">${buildCardBody(clip)}</div>`;
  return card;
}

function buildReconSep() {
  const sep = document.createElement('div');
  sep.className = 'recon-sep';
  sep.dataset.isSep = 'true';
  const detail = state.reconnect
    ? `джерело: ${getClip(state.reconnect.clipId)?.streamer || '?'} · ${fmtTime(state.reconnect.from)} → ${fmtTime(state.reconnect.to)}`
    : 'джерело не вибрано — тегни RECONNECT на кліпі';
  sep.innerHTML = `
    <span class="recon-sep-icon">⟳</span>
    <div class="recon-sep-info">
      <div class="recon-sep-title">RECONNECT transition тут</div>
      <div class="recon-sep-detail">${detail}</div>
    </div>
    <span class="recon-sep-move">↕ перемістити</span>`;
  return sep;
}

function toggleCard(e, header) {
  if (e.target.dataset.handle || e.target.dataset.tag || e.target.closest('[data-tag]')) return;
  const body = header.nextElementSibling;
  const icon = header.querySelector('.expand-icon');
  const isOpen = body.classList.contains('open');
  body.classList.toggle('open', !isOpen);
  icon.textContent = isOpen ? '▼' : '▲';
  if (!isOpen) initCardMedia(header.closest('.clip-card'));
}

function toggleTag(e, clipId, tag) {
  e.stopPropagation();
  const cs = getClipState(clipId);
  const clip = getClip(clipId);
  if (tag === 'short') {
    if (cs.short) { delete cs.short; } else { cs.short = { mode: 'desktop' }; }
  } else if (tag === 'thumb') {
    if (state.thumbnail && state.thumbnail.clipId === clipId) { state.thumbnail = null; }
    else { state.thumbnail = { clipId, at: +((cs.trimOut ?? clip.duration) * 0.6).toFixed(2) }; }
  } else if (tag === 'reconnect') {
    if (state.reconnect && state.reconnect.clipId === clipId) { state.reconnect = null; }
    else {
      const inT = cs.trimIn ?? 0;
      const outT = cs.trimOut ?? clip.duration;
      state.reconnect = { clipId, from: inT, to: Math.min(inT + 3, outT), afterIndex: 0 };
    }
  }
  saveState();
  renderClipList();
}

// ── SORTABLE ──────────────────────────────────────────────────────────────────
function initSortable() {
  const container = document.getElementById('clip-list');
  Sortable.create(container, {
    animation: 150,
    handle: '.drag-handle',
    filter: '.recon-sep',
    onEnd() {
      const newOrder = [];
      let reconAfter = null;
      container.querySelectorAll('[data-clip-id],[data-is-sep]').forEach(el => {
        if (el.dataset.isSep) { reconAfter = newOrder.length - 1; }
        else { newOrder.push(el.dataset.clipId); }
      });
      state.order = newOrder;
      if (state.reconnect && reconAfter !== null) {
        state.reconnect.afterIndex = Math.max(0, reconAfter);
      }
      saveState();
      updateNumbers();
    }
  });
}

function updateNumbers() {
  let num = 1;
  document.querySelectorAll('.clip-card').forEach(card => {
    card.querySelector('.clip-num').textContent = '#' + num++;
  });
}

function initCardMedia(card) {
  const clipId = card.dataset.clipId;
  const clip = getClip(clipId);
  const cs = getClipState(clipId);
  if (!clip || card.dataset.mediaInited) return;
  card.dataset.mediaInited = '1';

  const video = document.getElementById('vid-' + clipId);
  const track = document.getElementById('tl-' + clipId);
  const handleIn = document.getElementById('tl-in-' + clipId);
  const handleOut = document.getElementById('tl-out-' + clipId);
  const fill = document.getElementById('tl-fill-' + clipId);
  const playhead = document.getElementById('tl-ph-' + clipId);

  let inPct = cs.trimIn ? (cs.trimIn / clip.duration * 100) : 0;
  let outPct = cs.trimOut ? (cs.trimOut / clip.duration * 100) : 100;

  function updateFill() {
    fill.style.left = inPct + '%';
    fill.style.right = (100 - outPct) + '%';
    handleIn.style.left = inPct + '%';
    handleOut.style.right = (100 - outPct) + '%';
    document.getElementById('tl-time-in-' + clipId).textContent = 'in: ' + fmtTime(inPct / 100 * clip.duration);
    document.getElementById('tl-time-out-' + clipId).textContent = 'out: ' + fmtTime(outPct / 100 * clip.duration);
    cs.trimIn = +(inPct / 100 * clip.duration).toFixed(2);
    cs.trimOut = +(outPct / 100 * clip.duration).toFixed(2);
    saveState();
    updateDuration();
  }

  function makeDragHandle(handle, type) {
    handle.addEventListener('mousedown', e => {
      e.preventDefault();
      const rect = track.getBoundingClientRect();
      const onMove = e => {
        let pct = Math.max(0, Math.min(100, (e.clientX - rect.left) / rect.width * 100));
        if (type === 'in') { inPct = Math.min(pct, outPct - 2); if (video) video.currentTime = inPct / 100 * clip.duration; }
        else { outPct = Math.max(pct, inPct + 2); if (video) video.currentTime = outPct / 100 * clip.duration; }
        updateFill();
      };
      const onUp = () => { document.removeEventListener('mousemove', onMove); document.removeEventListener('mouseup', onUp); };
      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onUp);
    });
  }

  makeDragHandle(handleIn, 'in');
  makeDragHandle(handleOut, 'out');
  updateFill();

  track.addEventListener('click', e => {
    if (e.target === handleIn || e.target === handleOut) return;
    const rect = track.getBoundingClientRect();
    const pct = (e.clientX - rect.left) / rect.width;
    if (video) video.currentTime = pct * clip.duration;
  });

  if (video) {
    video.addEventListener('timeupdate', () => {
      const pct = video.currentTime / clip.duration * 100;
      playhead.style.left = pct + '%';
      document.getElementById('playpos-' + clipId).textContent =
        fmtTime(video.currentTime) + ' / ' + fmtTimeSec(clip.duration);
      if (card.dataset.playMode === 'preview') {
        for (const [cs2, ce2] of (cs.cuts || [])) {
          if (video.currentTime >= cs2 && video.currentTime < ce2) { video.currentTime = ce2; break; }
        }
        if (video.currentTime >= (outPct / 100) * clip.duration) video.pause();
      }
    });
    video.addEventListener('play', () => {
      const btns = card.querySelectorAll('.ctrl-btn');
      btns.forEach(b => { if (b.textContent === '▶') b.textContent = '⏸'; });
    });
    video.addEventListener('pause', () => {
      const btns = card.querySelectorAll('.ctrl-btn');
      btns.forEach(b => { if (b.textContent === '⏸') b.textContent = '▶'; });
    });
  }
  renderCutZones(clipId, clip);
  syncTagSections(clipId);
}

function setPlayMode(clipId, mode, btn) {
  const card = document.querySelector(`[data-clip-id="${clipId}"]`);
  card.dataset.playMode = mode;
  card.querySelectorAll('.play-mode-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  if (mode === 'preview') {
    const cs = getClipState(clipId);
    const video = document.getElementById('vid-' + clipId);
    if (video) { video.currentTime = cs.trimIn ?? 0; video.play(); }
  }
}

function togglePlay(clipId) {
  const video = document.getElementById('vid-' + clipId);
  if (!video) return;
  video.paused ? video.play() : video.pause();
}

function seekRel(clipId, delta) {
  const video = document.getElementById('vid-' + clipId);
  if (video) video.currentTime = Math.max(0, video.currentTime + delta);
}

// ── CUTS ──────────────────────────────────────────────────────────────────────
function parseMmSs(str) {
  const parts = str.trim().split(':');
  if (parts.length === 2) return parseFloat(parts[0]) * 60 + parseFloat(parts[1]);
  return parseFloat(str) || 0;
}

function addCut(clipId) {
  const clip = getClip(clipId);
  const cs = getClipState(clipId);
  const from = Math.max(0, parseMmSs(document.getElementById('cut-from-' + clipId).value));
  const to = Math.min(clip.duration, parseMmSs(document.getElementById('cut-to-' + clipId).value));
  if (to <= from) return;
  if (!cs.cuts) cs.cuts = [];
  cs.cuts.push([+from.toFixed(2), +to.toFixed(2)]);
  cs.cuts.sort((a, b) => a[0] - b[0]);
  saveState();
  renderCutZones(clipId, clip);
  renderClipList();
}

function removeCut(clipId, idx) {
  const cs = getClipState(clipId);
  cs.cuts.splice(idx, 1);
  saveState();
  renderCutZones(clipId, getClip(clipId));
  renderClipList();
}

function renderCutZones(clipId, clip) {
  const cs = getClipState(clipId);
  const track = document.getElementById('tl-' + clipId);
  if (!track) return;
  track.querySelectorAll('.tl-cut-zone').forEach(el => el.remove());
  (cs.cuts || []).forEach(([from, to]) => {
    const zone = document.createElement('div');
    zone.className = 'tl-cut-zone';
    zone.style.left = (from / clip.duration * 100) + '%';
    zone.style.width = ((to - from) / clip.duration * 100) + '%';
    track.appendChild(zone);
  });
  const list = document.getElementById('cuts-list-' + clipId);
  if (!list) return;
  list.innerHTML = '';
  (cs.cuts || []).forEach(([from, to], i) => {
    const row = document.createElement('div');
    row.className = 'ctrl-row';
    row.style.marginTop = '5px';
    row.innerHTML = `<span style="color:#ff6b6b;font-size:11px;font-family:monospace">✂ ${fmtTime(from)} → ${fmtTime(to)}</span>
      <button class="ctrl-btn red" style="padding:2px 8px;font-size:10px" onclick="removeCut('${clipId}',${i})">× видалити</button>`;
    list.appendChild(row);
  });
}

function syncTagSections(clipId) {
  const cs = getClipState(clipId);
  const isRecon = state.reconnect?.clipId === clipId;
  const isThumb = state.thumbnail?.clipId === clipId;
  const isShort = !!cs.short;
  const secR = document.getElementById('sec-reconnect-' + clipId);
  const secT = document.getElementById('sec-thumb-' + clipId);
  const secS = document.getElementById('sec-short-' + clipId);
  if (secR) secR.style.display = isRecon ? 'block' : 'none';
  if (secT) {
    secT.style.display = isThumb ? 'block' : 'none';
    if (isThumb) { const inp = document.getElementById('thumb-at-' + clipId); if (inp) inp.value = fmtTime(state.thumbnail.at); }
  }
  if (secS) {
    secS.style.display = isShort ? 'block' : 'none';
    if (isShort && cs.short.mode) {
      secS.querySelectorAll('.mode-btn').forEach(b => b.classList.toggle('active', b.dataset.mode === cs.short.mode));
      const splitEd = document.getElementById('split-editor-' + clipId);
      if (splitEd) splitEd.style.display = cs.short.mode === 'split' ? 'block' : 'none';
    }
  }
  if (isRecon && state.reconnect) {
    const fromIn = document.getElementById('recon-from-' + clipId);
    const toIn = document.getElementById('recon-to-' + clipId);
    if (fromIn) fromIn.value = fmtTime(state.reconnect.from);
    if (toIn) toIn.value = fmtTime(state.reconnect.to);
  }
}

function setShortMode(clipId, mode, btn) {
  const cs = getClipState(clipId);
  if (!cs.short) cs.short = {};
  cs.short.mode = mode;
  const sec = document.getElementById('sec-short-' + clipId);
  sec.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  const splitEd = document.getElementById('split-editor-' + clipId);
  if (splitEd) splitEd.style.display = mode === 'split' ? 'block' : 'none';
  if (mode === 'split') {
    const saved = getSavedCam(getClip(clipId)?.streamer || '');
    if (saved) restoreCamBox(clipId, saved);
    initCanvasVideo(clipId);
  }
  saveState();
}

function applyReconnectTiming(clipId) {
  if (!state.reconnect || state.reconnect.clipId !== clipId) return;
  state.reconnect.from = parseMmSs(document.getElementById('recon-from-' + clipId).value);
  state.reconnect.to = parseMmSs(document.getElementById('recon-to-' + clipId).value);
  saveState(); renderClipList();
}

function applyThumbAt(clipId) {
  if (!state.thumbnail || state.thumbnail.clipId !== clipId) return;
  state.thumbnail.at = parseMmSs(document.getElementById('thumb-at-' + clipId).value);
  saveState(); renderClipList();
}

function setThumbFromPlayhead(clipId) {
  const video = document.getElementById('vid-' + clipId);

// ── SPLIT EDITOR ──────────────────────────────────────────────────────────────
function startBoxDrag(e, clipId, boxType) {
  if (e.target.classList.contains('resize-handle')) return;
  e.preventDefault();
  const canvas = document.getElementById('canvas-' + clipId);
  const box = document.getElementById((boxType === 'cam' ? 'cam-' : 'game-') + clipId);
  const rect = canvas.getBoundingClientRect();
  const bRect = box.getBoundingClientRect();
  const offX = e.clientX - bRect.left;
  const offY = e.clientY - bRect.top;
  const onMove = e => {
    const x = Math.max(0, Math.min(rect.width - bRect.width, e.clientX - rect.left - offX));
    const y = Math.max(0, Math.min(rect.height - bRect.height, e.clientY - rect.top - offY));
    box.style.left = (x / rect.width * 100) + '%';
    box.style.top = (y / rect.height * 100) + '%';
    box.style.right = 'auto'; box.style.bottom = 'auto';
    updateCoordHint(clipId);
  };
  const onUp = () => { document.removeEventListener('mousemove', onMove); document.removeEventListener('mouseup', onUp); saveState(); };
  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup', onUp);
}

function startBoxResize(e, clipId) {
  e.preventDefault(); e.stopPropagation();
  const canvas = document.getElementById('canvas-' + clipId);
  const box = document.getElementById('cam-' + clipId);
  const rect = canvas.getBoundingClientRect();
  const startW = box.offsetWidth, startH = box.offsetHeight;
  const startX = e.clientX, startY = e.clientY;
  const onMove = e => {
    const w = Math.max(30, Math.min(rect.width * 0.5, startW + (e.clientX - startX)));
    const h = Math.max(20, Math.min(rect.height * 0.5, startH + (e.clientY - startY)));
    box.style.width = (w / rect.width * 100) + '%';
    box.style.height = (h / rect.height * 100) + '%';
    updateCoordHint(clipId);
  };
  const onUp = () => { document.removeEventListener('mousemove', onMove); document.removeEventListener('mouseup', onUp); saveState(); };
  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup', onUp);
}

function getCamCoords(clipId) {
  const canvas = document.getElementById('canvas-' + clipId);
  const box = document.getElementById('cam-' + clipId);
  if (!canvas || !box) return null;
  const r = canvas.getBoundingClientRect();
  const b = box.getBoundingClientRect();
  return [
    +((b.left - r.left) / r.width).toFixed(3),
    +((b.top - r.top) / r.height).toFixed(3),
    +(b.width / r.width).toFixed(3),
    +(b.height / r.height).toFixed(3)
  ];
}

function updateCoordHint(clipId) {
  const coords = getCamCoords(clipId);
  if (!coords) return;
  document.getElementById('coord-hint-' + clipId).textContent =
    `cam: ${(coords[0]*100).toFixed(0)}% ${(coords[1]*100).toFixed(0)}% ${(coords[2]*100).toFixed(0)}% ${(coords[3]*100).toFixed(0)}% · gameplay: auto`;
  const cs = getClipState(clipId);
  if (cs.short) cs.short.webcam = coords;
}

function saveCamForStreamer(clipId, streamer) {
  const coords = getCamCoords(clipId);
  if (!coords) return;
  const stored = JSON.parse(localStorage.getItem(CAM_KEY) || '{}');
  stored[streamer] = coords;
  localStorage.setItem(CAM_KEY, JSON.stringify(stored));
}

function getSavedCam(streamer) {
  return JSON.parse(localStorage.getItem(CAM_KEY) || '{}')[streamer] || null;
}

function restoreCamBox(clipId, coords) {
  const canvas = document.getElementById('canvas-' + clipId);
  const box = document.getElementById('cam-' + clipId);
  if (!canvas || !box) return;
  box.style.left = (coords[0]*100)+'%'; box.style.top = (coords[1]*100)+'%';
  box.style.width = (coords[2]*100)+'%'; box.style.height = (coords[3]*100)+'%';
  box.style.right = 'auto'; box.style.bottom = 'auto';
  const cs = getClipState(clipId);
  if (cs.short) cs.short.webcam = coords;
  updateCoordHint(clipId);
}

function initCanvasVideo(clipId) {
  const vid = document.getElementById('canvas-vid-' + clipId);
  const mainVid = document.getElementById('vid-' + clipId);
  if (!vid || !mainVid) return;
  vid.currentTime = mainVid.currentTime || 0;
}

// Phone drag-and-drop for cam position
document.addEventListener('dragover', e => e.preventDefault());
document.addEventListener('drop', e => {
  const phone = e.target.closest('.sp-phone');
  if (!phone) return;
  e.preventDefault();
  const clipId = phone.id.replace('phone-', '');
  const rect = phone.getBoundingClientRect();
  const mid = rect.top + rect.height / 2;
  const camEl = document.getElementById('sp-cam-' + clipId);
  const divEl = document.getElementById('sp-div-' + clipId);
  const gameEl = document.getElementById('sp-game-' + clipId);
  if (!camEl || !divEl || !gameEl) return;
  phone.innerHTML = '';
  if (e.clientY < mid) {
    phone.appendChild(camEl); phone.appendChild(divEl); phone.appendChild(gameEl);
    if (state.clips[clipId]?.short) state.clips[clipId].short.camPos = 'top';
  } else {
    phone.appendChild(gameEl); phone.appendChild(divEl); phone.appendChild(camEl);
    if (state.clips[clipId]?.short) state.clips[clipId].short.camPos = 'bottom';
  }
  saveState();
});

// ── BENCH ─────────────────────────────────────────────────────────────────────
function renderBench() {
  const bench = CLIPS_DATA.bench;
  document.getElementById('bench-label').textContent = `Bench — ще ${bench.length} кліпів`;
  const body = document.getElementById('bench-body');
  body.innerHTML = '';
  const cats = {};
  bench.forEach(clip => {
    if (!cats[clip.category]) cats[clip.category] = [];
    cats[clip.category].push(clip);
  });
  Object.entries(cats).sort((a,b) => a[0].localeCompare(b[0])).forEach(([cat, clips]) => {
    const catEl = document.createElement('div');
    catEl.className = 'bench-cat';
    const safeId = cat.replace(/\W/g,'_');
    catEl.innerHTML = `<div class="bench-cat-title">${cat} (${clips.length})</div>
      <div class="bench-cards" id="bench-cat-${safeId}"></div>`;
    body.appendChild(catEl);
    const cardsEl = catEl.querySelector('.bench-cards');
    clips.sort((a,b) => b.ddosScore - a.ddosScore).forEach(clip => cardsEl.appendChild(buildBenchCard(clip)));
  });
}

function buildBenchCard(clip) {
  const card = document.createElement('div');
  card.className = 'bench-card';
  card.dataset.clipId = clip.id;
  card.innerHTML = `
    <span class="bench-streamer">${clip.streamer}</span>
    <span class="bench-score">${clip.ddosScore}</span>
    <span class="bench-dur">${fmtTimeSec(clip.duration)}</span>
    <button class="bench-add" onclick="addFromBench('${clip.id}')">+</button>`;
  return card;
}

function addFromBench(clipId) {
  if (state.order.includes(clipId)) return;
  state.order.push(clipId);
  const idx = CLIPS_DATA.bench.findIndex(c => c.id === clipId);
  if (idx !== -1) { CLIPS_DATA.selected.push(CLIPS_DATA.bench.splice(idx, 1)[0]); }
  saveState();
  renderClipList();
  renderBench();
}

function toggleBench(btn) {
  const body = document.getElementById('bench-body');
  const isOpen = body.classList.contains('open');
  body.classList.toggle('open', !isOpen);
  document.getElementById('bench-arrow').textContent = isOpen ? '▶' : '▼';
}

// ── TOPBAR ────────────────────────────────────────────────────────────────────
function updateTopbar() {
  document.getElementById('count-display').textContent =
    state.order.length + ' / ' + (CLIPS_DATA.selected.length + CLIPS_DATA.bench.length);
  const shortCount = state.order.filter(id => !!state.clips[id]?.short).length;
  document.getElementById('shorts-display').textContent = shortCount;
  const reconBadge = document.getElementById('reconnect-badge');
  if (state.reconnect) {
    reconBadge.style.display = '';
    document.getElementById('reconnect-display').textContent =
      `${getClip(state.reconnect.clipId)?.streamer || '?'} ${fmtTime(state.reconnect.from)}–${fmtTime(state.reconnect.to)}`;
  } else { reconBadge.style.display = 'none'; }
  const thumbBadge = document.getElementById('thumb-badge');
  if (state.thumbnail) {
    thumbBadge.style.display = '';
    document.getElementById('thumb-display').textContent =
      `${getClip(state.thumbnail.clipId)?.streamer || '?'} ${fmtTime(state.thumbnail.at)}`;
  } else { thumbBadge.style.display = 'none'; }
}

function updateDuration() {
  let total = 1.25 + 1.25;
  const reconCount = Math.max(0, Math.floor(state.order.length / 3) - 1);
  total += reconCount;
  state.order.forEach(clipId => {
    const clip = getClip(clipId);
    const cs = state.clips[clipId] || {};
    if (!clip) return;
    const inT = cs.trimIn ?? 0;
    const outT = cs.trimOut ?? clip.duration;
    let dur = outT - inT;
    (cs.cuts || []).forEach(([from, to]) => {
      const cf = Math.max(from, inT), ct = Math.min(to, outT);
      if (ct > cf) dur -= (ct - cf);
    });
    total += Math.max(0, dur);
  });
  const m = Math.floor(total / 60);
  const s = Math.round(total % 60).toString().padStart(2, '0');
  document.getElementById('dur-display').textContent = `~${m}:${s}`;
}

// ── JSON GENERATOR ────────────────────────────────────────────────────────────
function buildJSON() {
  const out = {
    runId: CLIPS_DATA.runId,
    clipOrder: state.order,
    reconnect: state.reconnect || null,
    thumbnail: state.thumbnail || null,
    clips: {}
  };
  state.order.forEach(clipId => {
    const cs = state.clips[clipId] || {};
    const entry = {};
    if (cs.trimIn !== undefined || cs.trimOut !== undefined) {
      entry.trim = {};
      if (cs.trimIn !== undefined) entry.trim.in = +cs.trimIn.toFixed(2);
      if (cs.trimOut !== undefined) entry.trim.out = +cs.trimOut.toFixed(2);
    }
    if (cs.cuts && cs.cuts.length > 0) entry.cuts = cs.cuts;
    if (cs.short) entry.short = cs.short;
    if (Object.keys(entry).length > 0) out.clips[clipId] = entry;
  });
  return out;
}

function updatePrompt() {
  document.getElementById('prompt-code').textContent = JSON.stringify(buildJSON(), null, 2);
}

function copyPrompt() {
  const json = buildJSON();
  const text = `Editorial decisions for /ddos resume — paste this to Claude:\n\n${JSON.stringify(json, null, 2)}`;
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.querySelector('.btn-copy');
    const origText = btn.textContent;
    btn.textContent = '✓ Copied!';
    setTimeout(() => { btn.textContent = origText; }, 2000);
  });
}
</script>
