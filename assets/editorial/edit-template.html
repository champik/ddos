<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DDOS Editorial</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0e0e10;color:#f4f0e6;font-family:'Space Grotesk',system-ui,sans-serif;font-size:13px;padding:20px}
h1{font-family:Anton,Impact,sans-serif;font-size:26px;color:#f5ff3d;letter-spacing:1px;margin-bottom:3px}
.meta{color:#666;font-size:11px;font-family:monospace;margin-bottom:18px}
.topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid #2a2a2f}
.badges{display:flex;gap:7px;flex-wrap:wrap;margin-top:6px}
.badge{background:#1a1a1f;border:1px solid #2a2a2f;border-radius:6px;padding:3px 9px;font-size:11px;color:#888}
.badge span{color:#f5ff3d}
.badge.dur{border-color:#4ade8044}.badge.dur span{color:#4ade80;font-size:13px;font-weight:700}
.btn-copy{background:#f5ff3d;color:#0e0e10;border:none;border-radius:8px;padding:10px 18px;font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap;flex-shrink:0}
.clip-card{background:#13131a;border:1px solid #2a2a2f;border-radius:10px;overflow:hidden;margin-bottom:6px}
.clip-card.sortable-ghost{opacity:0.3}
.card-header{display:flex;align-items:center;gap:9px;padding:9px 13px;cursor:pointer;user-select:none}
.drag-handle{color:#2a2a3a;font-size:16px;cursor:grab;flex-shrink:0}
.drag-handle:active{cursor:grabbing}
.clip-num{color:#f5ff3d;font-family:monospace;font-weight:700;min-width:20px;font-size:12px}
.clip-streamer{font-weight:600;font-size:14px}
.clip-cat{color:#555;font-size:11px}
.clip-dur-display{color:#888;font-family:monospace;font-size:11px}
.card-tags{display:flex;gap:5px;margin-left:auto;align-items:center}
.tag{border-radius:20px;padding:2px 9px;font-size:10px;font-weight:700;opacity:0.28;border:1px solid currentColor;cursor:pointer;letter-spacing:.3px;transition:opacity .12s}
.tag:hover{opacity:.65}.tag.on{opacity:1}
.tag-short{color:#a78bfa}.tag-thumb{color:#4ade80}.tag-reconnect{color:#ff6b6b}
.mini-badge{font-size:10px;padding:2px 6px;border-radius:4px;font-family:monospace}
.mb-cut{background:#ff4a4a15;color:#ff6b6b}
.mb-thumb{background:#4ade8015;color:#4ade80}
.expand-icon{color:#2a2a3a;font-size:11px;margin-left:4px;flex-shrink:0}
.card-body{padding:13px;border-top:1px solid #1a1a22;display:none}
.card-body.open{display:block}
.video-wrap{background:#000;border-radius:8px;aspect-ratio:16/9;width:100%;overflow:hidden;position:relative}
.video-wrap video{width:100%;height:100%;display:block}
.play-mode-row{display:flex;gap:6px;margin-top:7px;align-items:center}
.play-mode-btn{background:#1a1a24;border:1px solid #2a2a2f;border-radius:6px;padding:4px 10px;color:#666;font-size:11px;cursor:pointer}
.play-mode-btn.active{border-color:#f5ff3d;color:#f5ff3d;background:#f5ff3d0e}
.playpos{color:#666;font-family:monospace;font-size:11px;margin-left:auto}
.tl-wrap{margin-top:10px}
.tl-label{display:flex;justify-content:space-between;font-size:10px;color:#555;margin-bottom:4px}
.tl-track{height:34px;background:#161620;border-radius:6px;position:relative;cursor:pointer}
.tl-fill{position:absolute;top:0;height:100%;background:#f5ff3d14;border-radius:4px;cursor:grab}
.tl-fill:active{cursor:grabbing}
.tl-recon-zone-src{position:absolute;top:0;height:100%;background:#ff4a4a22;border:1px solid #ff6b6b55;border-radius:3px;pointer-events:none;z-index:1}
.tl-cut-zone{position:absolute;top:0;height:100%;background:#f5ff3d22;border:1px solid #f5ff3d55;border-radius:3px;pointer-events:none}
.tl-handle{position:absolute;top:-4px;width:12px;height:42px;background:#f5ff3d;border-radius:3px;cursor:ew-resize;transform:translateX(-50%)}
.tl-handle-out{transform:translateX(50%)}
.tl-playhead{position:absolute;top:-5px;width:2px;height:44px;background:#fff;opacity:.45;pointer-events:none}
.tl-thumb-mark{position:absolute;top:-5px;width:2px;height:44px;background:#4ade80;opacity:.9;pointer-events:none;display:none}
.tl-wrap.thumb-mode .tl-handle,.tl-wrap.thumb-mode .tl-fill{display:none}
.tl-wrap.preview-mode .tl-handle,.tl-wrap.preview-mode .tl-fill{display:none}
.tl-times{display:flex;justify-content:space-between;font-size:10px;color:#666;margin-top:4px;font-family:monospace}
.ctrl-row{display:flex;gap:7px;margin-top:9px;align-items:center;flex-wrap:wrap}
.ctrl-lbl{color:#555;font-size:11px}
.ctrl-in{background:#1a1a24;border:1px solid #2a2a2f;border-radius:5px;padding:4px 7px;color:#f4f0e6;font-size:11px;font-family:monospace;width:68px}
.ctrl-btn{background:#1a1a24;border:1px solid #2a2a2f;border-radius:6px;padding:4px 11px;color:#888;font-size:11px;cursor:pointer}
.ctrl-btn:hover{border-color:#f5ff3d55;color:#f4f0e6}
.ctrl-btn.red{border-color:#ff4a4a33;color:#ff6b6b}
.sec{border-radius:8px;padding:11px;margin-top:9px}
.sec.reconnect{background:#160a0a;border:1px solid #ff4a4a2a}
.sec.thumb{background:#0a160a;border:1px solid #4ade802a}
.sec.shorts{background:#100e1a;border:1px solid #a78bfa2a}
.sec-title{font-size:11px;font-weight:700;margin-bottom:9px}
.sec-title.red{color:#ff6b6b}.sec-title.green{color:#4ade80}.sec-title.purple{color:#a78bfa}
.mode-row{display:flex;gap:7px;margin-bottom:10px}
.mode-btn{flex:1;background:#1a1824;border:1px solid #2a2a2f;border-radius:8px;padding:7px 5px;text-align:center;cursor:pointer}
.mode-btn.active{border-color:#a78bfa;background:#a78bfa14}
.mode-icon{font-size:17px;display:block;margin-bottom:2px}
.mode-lbl{font-size:10px;color:#666}
.mode-btn.active .mode-lbl{color:#a78bfa}
.split-editor{display:grid;grid-template-columns:1fr 120px;gap:14px;align-items:start}
.split-canvas{position:relative;aspect-ratio:16/9;background:linear-gradient(135deg,#0a0a12,#12122a);border-radius:6px;overflow:hidden}
.split-canvas video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:6px;pointer-events:none}
.drag-box{position:absolute;border-radius:4px;cursor:move}
.cam-box-el{border:2px solid #f5ff3d;background:rgba(245,255,61,.12)}
.box-label{position:absolute;top:2px;left:4px;font-size:9px;color:#f5ff3d;background:#0e0e10cc;padding:1px 4px;border-radius:2px;white-space:nowrap;pointer-events:none}
.resize-handle{position:absolute;bottom:-5px;right:-5px;width:9px;height:9px;background:#f5ff3d;border-radius:50%;cursor:se-resize}
.coord-hint{font-size:10px;color:#333;font-family:monospace;margin-top:5px}
.preview-col{display:flex;flex-direction:column;align-items:center;gap:6px}
.preview-lbl{font-size:10px;color:#444;font-family:monospace}
.recon-sep{display:flex;align-items:center;gap:8px;padding:6px 13px;background:#150808;border:1px solid #ff4a4a33;border-radius:8px;margin:5px 0}
.recon-sep-standalone{cursor:grab}.recon-sep-standalone:active{cursor:grabbing}
.recon-sep.sortable-ghost{opacity:0.3}
.recon-sep-icon{color:#ff6b6b;font-size:15px;flex-shrink:0}
.recon-sep-info{flex:1}
.recon-sep-title{font-size:11px;color:#ff6b6b;font-weight:700}
.recon-sep-detail{font-size:10px;color:#662222;font-family:monospace;margin-top:1px}
.recon-sep-move{font-size:10px;color:#441111;cursor:pointer}
.recon-sep-move:hover{color:#ff6b6b}
.bench-wrap{margin-top:16px}
.bench-toggle{display:flex;align-items:center;gap:8px;padding:8px 13px;background:#0e0e16;border:1px solid #1e1e28;border-radius:8px;cursor:pointer;font-size:12px;color:#666}
.bench-toggle:hover{color:#aaa;border-color:#2a2a3a}
.bench-body{display:none;margin-top:8px}
.bench-body.open{display:block}
.bench-cat{margin-bottom:14px}
.bench-cat-title{font-size:10px;color:#555;font-family:monospace;font-weight:700;margin-bottom:6px;padding:0 2px}
.bench-cards{display:flex;flex-wrap:wrap;gap:6px}
.bench-card{background:#13131a;border:1px solid #222;border-radius:8px;padding:8px 10px;display:flex;align-items:center;gap:8px;cursor:grab;min-width:200px}
.bench-card:hover{border-color:#2a2a3a}
.bench-card.sortable-ghost{opacity:0.3}
.bench-streamer{font-weight:600;font-size:13px;flex:1}
.bench-dur{color:#555;font-size:11px;font-family:monospace}
.bench-add{background:#1a1a24;border:1px solid #2a2a2f;border-radius:5px;padding:3px 9px;color:#888;font-size:11px;cursor:pointer;flex-shrink:0}
.bench-add:hover{border-color:#f5ff3d55;color:#f4f0e6}
.btn-bench-it{background:none;border:1px solid #2a2a3a;border-radius:4px;color:#555;font-size:10px;cursor:pointer;padding:0;flex-shrink:0;width:22px;height:22px;display:flex;align-items:center;justify-content:center}
.btn-bench-it:hover{border-color:#ff6b6b55;color:#ff6b6b}
.prompt-block{background:#0a0a14;border:1px solid #1e1e28;border-radius:10px;padding:14px;margin-top:18px}
.prompt-title{color:#f5ff3d;font-size:11px;font-family:monospace;font-weight:700;margin-bottom:9px}
.prompt-code{font-family:monospace;font-size:11px;color:#6aaa6a;line-height:1.75;white-space:pre;overflow-x:auto;max-height:300px}
.prompt-actions{display:flex;gap:8px;margin-top:11px}
.btn-copy-json{background:transparent;border:1px solid #f5ff3d;color:#f5ff3d;border-radius:6px;padding:7px 15px;font-size:12px;cursor:pointer;transition:background .15s,color .15s}
.btn-copy-json.copied{background:#f5ff3d;color:#0e0e10;border-color:#f5ff3d}
.btn-add-recon{background:#160a0a;border:1px solid #ff4a4a44;border-radius:6px;padding:3px 10px;color:#ff6b6b;font-size:11px;cursor:pointer;font-weight:600;line-height:1}
.btn-add-recon:hover{border-color:#ff6b6b88;background:#1a0808}
.thumb-crop-box{position:absolute;border:2px solid #f5ff3d;background:rgba(245,255,61,.06);cursor:move;box-sizing:border-box;user-select:none}
.rh{position:absolute;width:10px;height:10px;border-radius:50%;pointer-events:all}
.rh.nw{top:-5px;left:-5px;cursor:nw-resize}
.rh.ne{top:-5px;right:-5px;cursor:ne-resize}
.rh.sw{bottom:-5px;left:-5px;cursor:sw-resize}
.rh.se{bottom:-5px;right:-5px;cursor:se-resize}
.vid-outer-wrap{display:flex;gap:8px;align-items:flex-start}
.vid-outer-wrap .video-wrap{flex:1;min-width:0}
.shorts-preview-col{flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:4px}
.split-preview-canvas{border-radius:4px;border:1px solid #222;background:#111;display:block;cursor:ns-resize}
.split-preview-canvas:hover{border-color:#333}
.shorts-sub-btn{flex:1;background:#1a1824;border:1px solid #2a2a2f;border-radius:6px;padding:5px 4px;text-align:center;cursor:pointer;font-size:11px;color:#666}
.shorts-sub-btn.active{border-color:#a78bfa;color:#a78bfa;background:#a78bfa14}
.region-label{position:absolute;top:2px;left:4px;font-size:9px;background:#0e0e10cc;padding:1px 4px;border-radius:2px;pointer-events:none}
.ctrl-btn.tag-thumb{color:#4ade8055;border-color:#4ade8022}
.ctrl-btn.tag-thumb.on{color:#4ade80;border-color:#4ade8066;background:#4ade8011}
.ctrl-btn.tag-short{color:#a78bfa55;border-color:#a78bfa22}
.ctrl-btn.tag-short.on{color:#a78bfa;border-color:#a78bfa66;background:#a78bfa11}
.ctrl-btn.tag-recon-src{color:#ff6b6b55;border-color:#ff4a4a22}
.ctrl-btn.tag-recon-src.on{color:#ff6b6b;border-color:#ff4a4a66;background:#ff4a4a11}
.twitch-link{display:inline-flex;align-items:center;flex-shrink:0;opacity:.4;transition:opacity .12s;text-decoration:none}
.twitch-link:hover{opacity:1}
</style>
</head>
<body>
<div style="max-width:900px;margin:0 auto" id="app">
  <div class="topbar">
    <div style="width:100%">
      <h1>EDITORIAL</h1>
      <div class="meta" id="meta-line">Loading...</div>

<script>
// ── STATE ─────────────────────────────────────────────────────────────────────
const STATE_KEY = 'ddos_editorial_' + CLIPS_DATA.runId;
const CAM_KEY = 'ddos_cam_coords';

let state = { order: [], reconnects: {}, reconnectSource: null, thumbnails: [], clips: {}, benched: [] };
// state.reconnects[clipId] = true  — separator position after that clip
// state.reconnectSource = { clipId, from, to } | null  — ONE global source clip+timing
// state.thumbnails = [{ clipId, at, crop, main }]  — ordered list, one has main:true

function saveState() { localStorage.setItem(STATE_KEY, JSON.stringify(state)); updatePrompt(); updateTopbar(); updateDuration(); }

function loadState() {
  const saved = localStorage.getItem(STATE_KEY);
  if (saved) {
    try {
      state = JSON.parse(saved);
      // Migrate from broken state.reconnect = {clipId,from,to} format
      if (state.reconnect !== undefined && !state.reconnectSource) {
        const r = state.reconnect;
        if (r && r.clipId) {
          state.reconnectSource = { clipId: r.clipId, from: r.from ?? 0, to: r.to ?? 3 };
          if (!state.reconnects) state.reconnects = {};
          state.reconnects[r.clipId] = true;
        } else {
          state.reconnectSource = null;
        }
        delete state.reconnect;
      }
      if (!state.reconnects) state.reconnects = {};
      if (state.reconnectSource === undefined) state.reconnectSource = null;
      // Migrate old single thumbnail → new thumbnails array
      if (state.thumbnail !== undefined) {
        state.thumbnails = state.thumbnail ? [{ ...state.thumbnail, main: true }] : [];
        delete state.thumbnail;
      }
      if (!state.thumbnails) state.thumbnails = [];
      return true;
    } catch(e) {}
  }
  return false;
}

function allClips() { return [...CLIPS_DATA.selected, ...CLIPS_DATA.bench]; }
function getClip(id) { return allClips().find(c => c.id === id); }
function getClipState(id) { if (!state.clips[id]) state.clips[id] = {}; return state.clips[id]; }

function getThumbEntry(clipId) { return (state.thumbnails || []).find(t => t.clipId === clipId) || null; }
function isThumbClip(clipId) { return !!(state.thumbnails || []).find(t => t.clipId === clipId); }

function fmtTime(sec) {
  const m = Math.floor(sec / 60);
  const s = (sec % 60).toFixed(1).padStart(4, '0');
  return m + ':' + s;
}
function fmtTimeSec(sec) {
  const m = Math.floor(sec / 60);
  const s = Math.round(sec % 60).toString().padStart(2, '0');
  return m + ':' + s;
}

// ── INIT ──────────────────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
  // Merge all clips into selected so everything starts in the main list
  const totalCount = CLIPS_DATA.selected.length + CLIPS_DATA.bench.length;
  CLIPS_DATA.bench.forEach(c => CLIPS_DATA.selected.push(c));
  CLIPS_DATA.bench = [];

  const hadSaved = loadState();

  if (!hadSaved || state.order.length === 0) {
    state.order = CLIPS_DATA.selected.map(c => c.id);
    state.clips = {};
    state.benched = [];
  } else {
    // Migrate old state.moved format → new state.benched
    if (state.moved !== undefined && state.benched === undefined) {
      const allIds = CLIPS_DATA.selected.map(c => c.id);
      state.benched = allIds.filter(id => !state.order.includes(id));
      delete state.moved;
    }
    if (!state.benched) state.benched = [];
    // Restore bench from state.benched
    state.benched.forEach(clipId => {
      const idx = CLIPS_DATA.selected.findIndex(c => c.id === clipId);
      if (idx !== -1) CLIPS_DATA.bench.push(CLIPS_DATA.selected.splice(idx, 1)[0]);
    });
    // Ensure order only has valid non-benched clips (keep standalone recons)
    state.order = state.order.filter(id => id.startsWith('__recon_') || (!state.benched.includes(id) && CLIPS_DATA.selected.some(c => c.id === id)));
    // Add any new clips not yet in order or bench (e.g. manually added after save)
    const knownIds = new Set([...state.order, ...state.benched]);
    CLIPS_DATA.selected.forEach(c => { if (!knownIds.has(c.id)) state.order.push(c.id); });
  }

  document.getElementById('meta-line').textContent =
    CLIPS_DATA.runId + ' · ' + totalCount + ' кліпів scored';
  renderClipList();
  renderBench();
  updateTopbar();
  updatePrompt();
  updateDuration();
});

function getClipUsedDur(clipId) {
  const clip = getClip(clipId);
  if (!clip) return 0;
  const cs = state.clips[clipId] || {};
  const keeps = cs.keeps;
  if (keeps && keeps.length > 0) {
    return keeps.reduce((sum, [f, t]) => sum + Math.max(0, t - f), 0);
  }
  return clip.duration;
}

// ── RENDER CLIP LIST ──────────────────────────────────────────────────────────
function renderClipList() {
  const container = document.getElementById('clip-list');
  container.innerHTML = '';
  let clipNum = 0;
  state.order.forEach(id => {
    if (id.startsWith('__recon_')) {
      container.appendChild(buildStandaloneReconSep(id));
    } else {
      const clip = getClip(id);
      if (!clip) return;
      clipNum++;
      container.appendChild(buildClipCard(clip, clipNum));
      if (state.reconnects[id]) container.appendChild(buildReconSep(id));
    }
  });
  initSortable();
}

function buildReconSep(clipId) {
  const sep = document.createElement('div');
  sep.className = 'recon-sep recon-sep-attached';
  sep.dataset.isSep = 'true';
  sep.dataset.reconClipId = clipId;
  const src = state.reconnectSource;
  const detail = src
    ? `джерело: ${getClip(src.clipId)?.streamer || '?'} · ${fmtTime(src.from)} → ${fmtTime(src.to)}`
    : 'джерело не вибрано';
  sep.innerHTML = `
    <span class="recon-sep-icon">⟳</span>
    <div class="recon-sep-info">
      <div class="recon-sep-title">RECONNECT transition тут</div>
      <div class="recon-sep-detail" id="recon-sep-detail-${clipId}">${detail}</div>
    </div>`;
  return sep;
}

function buildStandaloneReconSep(reconId) {

  sep.dataset.reconId = reconId;

function toggleCard(e, header) {
  if (e.target.dataset.handle || e.target.dataset.tag || e.target.closest('[data-tag]')) return;
  const body = header.nextElementSibling;
  const icon = header.querySelector('.expand-icon');
  const isOpen = body.classList.contains('open');
  body.classList.toggle('open', !isOpen);
  icon.textContent = isOpen ? '▼' : '▲';
  if (!isOpen) initCardMedia(header.closest('.clip-card'));
}

function toggleTag(e, clipId, tag) {
  e.stopPropagation();
  const cs = getClipState(clipId);
  const clip = getClip(clipId);
  const extraUpdates = [];
  let tagAdded = false;
  if (tag === 'short') {
    if (cs.short) { delete cs.short; } else { cs.short = { mode: 'desktop' }; tagAdded = true; }
  } else if (tag === 'thumb') {
    const video = document.getElementById('vid-' + clipId);
    const currentTime = video ? +video.currentTime.toFixed(2) : 0;
    const existing = getThumbEntry(clipId);
    if (existing) {
      state.thumbnails = state.thumbnails.filter(t => t.clipId !== clipId);
      if (state.thumbnails.length > 0) state.thumbnails[0].main = true;
      state.thumbnails.forEach(t => extraUpdates.push(t.clipId));
    } else {
      const isFirst = state.thumbnails.length === 0;
      state.thumbnails.push({ clipId, at: currentTime, main: isFirst });
      tagAdded = true;
    }
  } else if (tag === 'reconnect') {
    if (state.reconnects[clipId]) {
      delete state.reconnects[clipId];
    } else {
      state.reconnects[clipId] = true;
    }
  }
  saveState();
  updateCardInPlace(clipId);
  extraUpdates.forEach(id => updateCardInPlace(id));
  if (tag === 'reconnect') refreshSeps();
  if (tagAdded) {
    if (tag === 'thumb') {
      const btn = document.getElementById('thumb-mode-btn-' + clipId);
      if (btn) setPlayMode(clipId, 'thumbnail', btn);
    } else if (tag === 'short') {
      const btn = document.getElementById('shorts-mode-btn-' + clipId);
      if (btn) setPlayMode(clipId, 'shorts', btn);
    }
  }
}

// ── SORTABLE ──────────────────────────────────────────────────────────────────
function initSortable() {
  const container = document.getElementById('clip-list');
  Sortable.create(container, {
    animation: 150,
    handle: '.card-header, .recon-sep-standalone',
    filter: '.recon-sep-attached, .btn-bench-it',
    preventOnFilter: false,
    onEnd() {
      const newOrder = [];
      Array.from(container.children).forEach(el => {
        if (el.dataset.clipId) newOrder.push(el.dataset.clipId);
        else if (el.dataset.reconId) newOrder.push(el.dataset.reconId);
      });
      state.order = newOrder;
      saveState();
      refreshSeps();
    }
  });
}

function updateNumbers() {
  let num = 1;
  document.querySelectorAll('.clip-card').forEach(card => {
    card.querySelector('.clip-num').textContent = '#' + num++;
  });
}

function refreshSeps() {
  const container = document.getElementById('clip-list');
  container.querySelectorAll('[data-is-sep]').forEach(el => el.remove());
  container.querySelectorAll('.clip-card').forEach(el => {
    const clipId = el.dataset.clipId;
    if (state.reconnects[clipId]) el.after(buildReconSep(clipId));
  });
  const src = state.reconnectSource;
  const detail = src
    ? `джерело: ${getClip(src.clipId)?.streamer || '?'} · ${fmtTime(src.from)} → ${fmtTime(src.to)}`
    : 'джерело не вибрано';
  container.querySelectorAll('.recon-sep-standalone .recon-sep-detail').forEach(el => {
    el.textContent = detail;
  });
  updateNumbers();
}

function updateCardInPlace(clipId) {
  const card = document.querySelector(`[data-clip-id="${clipId}"]`);
  if (!card) return;
  const cs = getClipState(clipId);
  const isShort = !!cs.short;
  const isThumb = isThumbClip(clipId);
  const isRecon = !!state.reconnects[clipId];
  const isReconSrc = state.reconnectSource?.clipId === clipId;
  const cutCount = (cs.keeps || []).length;

  card.querySelectorAll('.tag-short').forEach(el => el.classList.toggle('on', isShort));
  card.querySelectorAll('.tag-thumb').forEach(el => el.classList.toggle('on', isThumb));
  card.querySelectorAll('.tag-recon-src').forEach(el => el.classList.toggle('on', isReconSrc));

  const clip = getClip(clipId);
  const usedSpan = card.querySelector('.clip-dur-used');
  if (usedSpan && clip) usedSpan.innerHTML = `<span style="color:#f5ff3d">${fmtTimeSec(getClipUsedDur(clipId))}</span>/${fmtTimeSec(clip.duration)}`;

  const cardTags = card.querySelector('.card-tags');
  cardTags.innerHTML = '';
  const mkTag = (cls, text) => { const s = document.createElement('span'); s.className = cls; s.style.cursor = 'default'; s.textContent = text; cardTags.appendChild(s); };
  const mkBadge = (cls, text) => { const s = document.createElement('span'); s.className = cls; s.textContent = text; cardTags.appendChild(s); };
  if (isShort) mkTag('tag tag-short on', 'SHORT');
  if (isThumb) mkTag('tag tag-thumb on', 'THUMB');
  if (isRecon) mkTag('tag tag-reconnect on', 'RECONNECT');
  if (isReconSrc) mkTag('tag tag-reconnect on', 'RECONNECT');
  if (cutCount > 0) mkBadge('mini-badge mb-cut', `✂ ${cutCount}`);

  if (card.dataset.mediaInited) syncTagSections(clipId);

  const sepDetail = document.getElementById('recon-sep-detail-' + clipId);
  if (sepDetail) {
    const src = state.reconnectSource;
    sepDetail.textContent = src
      ? `джерело: ${getClip(src.clipId)?.streamer || '?'} · ${fmtTime(src.from)} → ${fmtTime(src.to)}`
      : 'джерело не вибрано';
  }

  updateTimingExtras(clipId);
  updateTopbar();
  updatePrompt();
}

function updateTimingExtras(clipId) {
  const el = document.getElementById('timing-extras-' + clipId);
  if (!el) return;
  let html = '';
  const src = state.reconnectSource;
  if (src && src.clipId === clipId) {
    html += `<div class="ctrl-row" style="margin-top:5px"><span style="color:#ff6b6b;font-size:11px;font-family:monospace">⟳ ${fmtTime(src.from)} → ${fmtTime(src.to)}</span></div>`;
  }
  const thumbEntry = getThumbEntry(clipId);
  if (thumbEntry) {
    html += `<div class="ctrl-row" style="margin-top:5px">
      <span style="color:#4ade80;font-size:11px;font-family:monospace">🖼 ${fmtTime(thumbEntry.at)}</span>
    </div>`;
  }
  el.innerHTML = html;
}

function initCardMedia(card) {
  const clipId = card.dataset.clipId;
  const clip = getClip(clipId);
  const cs = getClipState(clipId);
  if (!clip || card.dataset.mediaInited) return;
  card.dataset.mediaInited = '1';

  const video = document.getElementById('vid-' + clipId);
  const track = document.getElementById('tl-' + clipId);
  const handleIn = document.getElementById('tl-in-' + clipId);
  const handleOut = document.getElementById('tl-out-' + clipId);
  const fill = document.getElementById('tl-fill-' + clipId);
  const playhead = document.getElementById('tl-ph-' + clipId);

  let inPct = cs.trimIn ? (cs.trimIn / clip.duration * 100) : 0;
  let outPct = cs.trimOut ? (cs.trimOut / clip.duration * 100) : 100;

  function updateFill() {
    fill.style.left = inPct + '%';
    fill.style.right = (100 - outPct) + '%';
    handleIn.style.left = inPct + '%';
    handleOut.style.right = (100 - outPct) + '%';
    const inSec = inPct / 100 * clip.duration;
    const outSec = outPct / 100 * clip.duration;
    document.getElementById('tl-time-in-' + clipId).textContent = 'in: ' + fmtTime(inSec);
    document.getElementById('tl-time-out-' + clipId).textContent = 'out: ' + fmtTime(outSec);
    const fromIn = document.getElementById('cut-from-' + clipId);
    const toIn = document.getElementById('cut-to-' + clipId);
    if (fromIn) fromIn.value = fmtTime(inSec);
    if (toIn) toIn.value = fmtTime(outSec);
  }

  card._updateFill = updateFill;

  function makeDragHandle(handle, type) {
    handle.addEventListener('mousedown', e => {
      e.preventDefault();
      e.stopPropagation();
      const rect = track.getBoundingClientRect();
      const onMove = e => {
        let pct = Math.max(0, Math.min(100, (e.clientX - rect.left) / rect.width * 100));
        if (type === 'in') { inPct = Math.min(pct, outPct - 2); if (video) video.currentTime = inPct / 100 * clip.duration; }
        else { outPct = Math.max(pct, inPct + 2); if (video) video.currentTime = outPct / 100 * clip.duration; }
        updateFill();
      };
      const onUp = () => {
        document.removeEventListener('mousemove', onMove);
        document.removeEventListener('mouseup', onUp);
        cs.trimIn = +(inPct / 100 * clip.duration).toFixed(2);
        cs.trimOut = +(outPct / 100 * clip.duration).toFixed(2);
        saveState();
        updateDuration();
      };
      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onUp);
    });
  }

  makeDragHandle(handleIn, 'in');
  makeDragHandle(handleOut, 'out');
  updateFill();

  // Drag whole interval (fill) left/right preserving width
  fill.addEventListener('mousedown', e => {
    if (e.target === handleIn || e.target === handleOut) return;
    if (card.dataset.playMode === 'preview') return;
    e.preventDefault();
    const rect = track.getBoundingClientRect();
    const width = outPct - inPct;
    const startX = e.clientX;
    const startInPct = inPct;
    fill.style.cursor = 'grabbing';
    const onMove = ev => {
      const delta = (ev.clientX - startX) / rect.width * 100;
      inPct = Math.max(0, Math.min(100 - width, startInPct + delta));
      outPct = inPct + width;
      updateFill();
    };
    const onUp = () => {
      fill.style.cursor = 'grab';
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
      cs.trimIn = +(inPct / 100 * clip.duration).toFixed(2);
      cs.trimOut = +(outPct / 100 * clip.duration).toFixed(2);
      saveState();
      updateDuration();
    };
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  });

  track.addEventListener('click', e => {
    if (e.target === handleIn || e.target === handleOut) return;
    const rect = track.getBoundingClientRect();
    const pct = (e.clientX - rect.left) / rect.width;
    if (card.dataset.playMode === 'preview') {
      const keeps = cs.keeps;
      if (keeps && keeps.length > 0) {
        const clickSec = pct * clip.duration;
        if (!keeps.some(([s, en]) => clickSec >= s && clickSec <= en)) return;
      } else {
        if (pct * 100 < inPct || pct * 100 > outPct) return;
      }
    }
    if (video) video.currentTime = pct * clip.duration;
  });

  // Bidirectional input↔handle sync
  const fromIn = document.getElementById('cut-from-' + clipId);
  const toIn = document.getElementById('cut-to-' + clipId);
  if (fromIn) fromIn.addEventListener('input', () => {
    const sec = parseMmSs(fromIn.value);
    if (isNaN(sec)) return;
    if (card.dataset.playMode === 'reconnect') {
      const src = state.reconnectSource;
      if (!src || src.clipId !== clipId) return;
      src.from = Math.min(Math.max(0, sec), src.to - 0.5);
      updateReconFillUI(clipId);
      renderReconnectZone(clipId, clip);
      if (video) video.currentTime = src.from;
      saveState();
      updateTimingExtras(clipId);
    } else {
      inPct = Math.min(Math.max(0, sec / clip.duration * 100), outPct - 2);
      handleIn.style.left = inPct + '%';
      fill.style.left = inPct + '%';
      document.getElementById('tl-time-in-' + clipId).textContent = 'in: ' + fmtTime(inPct / 100 * clip.duration);
      cs.trimIn = +(inPct / 100 * clip.duration).toFixed(2);
      if (video) video.currentTime = cs.trimIn;
      saveState();
    }
  });
  if (toIn) toIn.addEventListener('input', () => {
    const sec = parseMmSs(toIn.value);
    if (isNaN(sec)) return;
    if (card.dataset.playMode === 'reconnect') {
      const src = state.reconnectSource;
      if (!src || src.clipId !== clipId) return;
      src.to = Math.max(Math.min(clip.duration, sec), src.from + 0.5);
      updateReconFillUI(clipId);
      renderReconnectZone(clipId, clip);
      if (video) video.currentTime = src.to;
      saveState();
      updateTimingExtras(clipId);
    } else {
      outPct = Math.max(Math.min(100, sec / clip.duration * 100), inPct + 2);
      handleOut.style.right = (100 - outPct) + '%';
      fill.style.right = (100 - outPct) + '%';
      document.getElementById('tl-time-out-' + clipId).textContent = 'out: ' + fmtTime(outPct / 100 * clip.duration);
      cs.trimOut = +(outPct / 100 * clip.duration).toFixed(2);
      if (video) video.currentTime = cs.trimOut;
      saveState();
    }
  });

  if (video) {
    video.addEventListener('timeupdate', () => {
      const pct = video.currentTime / clip.duration * 100;
      playhead.style.left = pct + '%';
      const playpos = document.getElementById('playpos-' + clipId);
      if (playpos) playpos.textContent = fmtTime(video.currentTime) + ' / ' + fmtTimeSec(clip.duration);
      if (card.dataset.playMode === 'reconnect') {
        const src = state.reconnectSource;
        if (src && src.clipId === clipId && video.currentTime >= src.to) video.pause();
      }
      if (card.dataset.playMode === 'preview') {
        const keeps = cs.keeps;
        const trimOut = cs.trimOut ?? clip.duration;
        if (keeps && keeps.length > 0) {
          const inKeep = keeps.some(([s, e]) => video.currentTime >= s && video.currentTime < e);
          if (!inKeep) {
            const nextKeep = keeps.find(([s, e]) => s > video.currentTime);
            if (nextKeep) { video.currentTime = nextKeep[0]; }
            else { video.pause(); }
          }
        }
        if (video.currentTime >= trimOut) video.pause();
      }
    });
  }
  renderCutZones(clipId, clip);
  renderReconnectZone(clipId, clip);
  syncTagSections(clipId);
  updateTimingExtras(clipId);
}

function setPlayMode(clipId, mode, btn) {
  const card = document.querySelector(`[data-clip-id="${clipId}"]`);
  card.dataset.playMode = mode;
  card.querySelectorAll('.play-mode-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  const tlStd = document.getElementById('tl-wrap-std-' + clipId);
  const tlRecon = document.getElementById('tl-wrap-recon-' + clipId);
  if (tlStd) {
    tlStd.style.display = mode === 'reconnect' ? 'none' : '';
    tlStd.classList.toggle('thumb-mode', mode === 'thumbnail');
    tlStd.classList.toggle('preview-mode', mode === 'preview');
  }
  if (tlRecon) {
    tlRecon.style.display = mode === 'reconnect' ? '' : 'none';
    if (mode === 'reconnect') initReconTimeline(clipId);
  }
  const cs = getClipState(clipId);
  const video = document.getElementById('vid-' + clipId);
  const cropBox = document.getElementById('thumb-crop-' + clipId);
  if (cropBox) cropBox.style.display = (mode === 'thumbnail' && isThumbClip(clipId)) ? 'block' : 'none';
  // Hide all shorts overlays; show only when in 'shorts' mode
  ['shorts-crop-desktop-','shorts-crop-mobile-','shorts-gameplay-','shorts-webcam-'].forEach(p => {
    const el = document.getElementById(p + clipId); if (el) el.style.display = 'none';
  });
  const splitPreviewWrap = document.getElementById('shorts-split-preview-' + clipId);
  if (splitPreviewWrap) splitPreviewWrap.style.display = 'none';
  const shortsModeRow = document.getElementById('shorts-mode-row-' + clipId);
  if (shortsModeRow) shortsModeRow.style.display = mode === 'shorts' ? '' : 'none';
  if (mode === 'preview' && video) {
    const keeps = cs.keeps;
    const startAt = (keeps && keeps.length > 0) ? keeps[0][0] : (cs.trimIn ?? 0);
    video.currentTime = startAt;
    video.play();
  }
  if (mode === 'reconnect' && video) {
    const src = state.reconnectSource;
    if (src && src.clipId === clipId) {
      video.currentTime = src.from;
      video.play();
      const fromIn = document.getElementById('cut-from-' + clipId);
      const toIn = document.getElementById('cut-to-' + clipId);
      if (fromIn) fromIn.value = fmtTime(src.from);
      if (toIn) toIn.value = fmtTime(src.to);
    }
  } else if (mode !== 'reconnect') {
    const cardEl = document.querySelector(`[data-clip-id="${clipId}"]`);
    if (cardEl?._updateFill) cardEl._updateFill();
  }
  if (mode === 'thumbnail' && video && isThumbClip(clipId)) {
    const tEntry = getThumbEntry(clipId);
    video.currentTime = tEntry.at;
    video.pause();
    if (cropBox) {
      const crop = tEntry.crop || { x: 0, y: 0, w: 100, h: 100 };
      cropBox.style.left = crop.x + '%';
      cropBox.style.top = crop.y + '%';
      cropBox.style.width = crop.w + '%';
      cropBox.style.height = crop.h + '%';
      initThumbCrop(clipId);
    }
  }
  if (mode === 'shorts') {
    migrateShortState(clipId);
    if (!cs.short) { cs.short = { mode: 'desktop' }; saveState(); }
    const subMode = cs.short.mode || 'desktop';
    // Highlight active sub-button
    ['desktop','mobile','split'].forEach(m => {
      const b = document.getElementById('shorts-sub-' + m + '-' + clipId);
      if (b) b.classList.toggle('active', m === subMode);
    });
    showShortsOverlay(clipId, subMode);
  }
}

function initThumbCrop(clipId) {
  const box = document.getElementById('thumb-crop-' + clipId);
  if (!box || box.dataset.cropInited) return;
  box.dataset.cropInited = '1';
  const wrap = box.parentElement;

  function getCrop() {
    return { x: parseFloat(box.style.left)||0, y: parseFloat(box.style.top)||0,
             w: parseFloat(box.style.width)||100, h: parseFloat(box.style.height)||100 };
  }
  function save() {
    const entry = getThumbEntry(clipId);
    if (!entry) return;
    entry.crop = getCrop(); saveState();
  }

  box.addEventListener('mousedown', e => {
    if (e.target.classList.contains('rh')) return;
    e.preventDefault();
    const rect = wrap.getBoundingClientRect();
    const { x: cx, y: cy, w, h } = getCrop();
    const sx = e.clientX, sy = e.clientY;
    const onMove = e => {
      const dx = (e.clientX - sx) / rect.width * 100;
      const dy = (e.clientY - sy) / rect.height * 100;
      positionBox(box, { x: Math.max(0, Math.min(100-w, cx+dx)), y: Math.max(0, Math.min(100-h, cy+dy)), w, h });
    };
    const onUp = () => { document.removeEventListener('mousemove', onMove); document.removeEventListener('mouseup', onUp); save(); };
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  });

  box.querySelectorAll('.rh').forEach(handle => {
    const isTop  = handle.classList.contains('nw') || handle.classList.contains('ne');
    const isLeft = handle.classList.contains('nw') || handle.classList.contains('sw');
    handle.addEventListener('mousedown', e => {
      e.preventDefault(); e.stopPropagation();
      const rect = wrap.getBoundingClientRect();
      const { x: ox, y: oy, w: ow, h: oh } = getCrop();
      const anchorX = isLeft ? ox + ow : ox;
      const anchorY = isTop  ? oy + oh : oy;
      const sx = e.clientX;
      const onMove = e => {
        const dx = (e.clientX - sx) / rect.width * 100;
        let nw = Math.max(10, isLeft ? ow - dx : ow + dx);
        nw = isLeft ? Math.min(anchorX, nw) : Math.min(100 - anchorX, nw);
        let nh = nw;
        const maxH = isTop ? anchorY : 100 - anchorY;
        if (nh > maxH) { nh = maxH; nw = nh; }
        positionBox(box, { x: isLeft ? anchorX - nw : anchorX, y: isTop ? anchorY - nh : anchorY, w: nw, h: nh });
      };
      const onUp = () => { document.removeEventListener('mousemove', onMove); document.removeEventListener('mouseup', onUp); save(); };
      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onUp);
    });
  });
}

// ── SHORTS TAB ────────────────────────────────────────────────────────────────

function migrateShortState(clipId) {
  const cs = getClipState(clipId);
  if (!cs.short) return;
  // Old format: cs.short.webcam = [rx,ry,rw,rh] (fractions 0-1)
  if (Array.isArray(cs.short.webcam)) {
    const [rx, ry, rw, rh] = cs.short.webcam;
    cs.short.split = {
      gameplay: { x: 0, y: 0, w: 100, h: 100 },
      webcam:   { x: +(rx*100).toFixed(2), y: +(ry*100).toFixed(2), w: +(rw*100).toFixed(2), h: +(rh*100).toFixed(2) },
      ratio: 726/1920
    };
    delete cs.short.webcam;
    delete cs.short.camPos;
    saveState();
  }
}

function defaultShortsCrop(mode) {
  if (mode === 'desktop') return { x: 0, y: 0, w: 100, h: 100 };
  if (mode === 'mobile')  return { x: 34.18, y: 0, w: 31.64, h: 100 };
  return null;
}

function setShortsSubMode(clipId, subMode, btn) {
  const cs = getClipState(clipId);
  if (!cs.short) cs.short = {};
  cs.short.mode = subMode;
  const card = document.querySelector(`[data-clip-id="${clipId}"]`);
  if (card) card.querySelectorAll('[id^="shorts-sub-"]').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  showShortsOverlay(clipId, subMode);
  saveState();
}

function showShortsOverlay(clipId, subMode) {
  const cs = getClipState(clipId);
  // Hide all overlays first
  ['shorts-crop-desktop-','shorts-crop-mobile-','shorts-gameplay-','shorts-webcam-'].forEach(p => {
    const el = document.getElementById(p + clipId); if (el) el.style.display = 'none';
  });
  const splitPreviewWrap = document.getElementById('shorts-split-preview-' + clipId);

  if (subMode === 'desktop') {
    if (splitPreviewWrap) splitPreviewWrap.style.display = 'none';
    const box = document.getElementById('shorts-crop-desktop-' + clipId);
    if (!box) return;
    const crop = cs.short?.desktop || defaultShortsCrop('desktop');
    if (!cs.short.desktop) { cs.short.desktop = crop; saveState(); }
    positionBox(box, crop);
    box.style.display = 'block';
    initRegionBox(clipId, 'shorts-crop-desktop-', '16:9', c => { cs.short.desktop = c; saveState(); });
  } else if (subMode === 'mobile') {
    if (splitPreviewWrap) splitPreviewWrap.style.display = 'none';
    const box = document.getElementById('shorts-crop-mobile-' + clipId);
    if (!box) return;
    const crop = cs.short?.mobile || defaultShortsCrop('mobile');
    if (!cs.short.mobile) { cs.short.mobile = crop; saveState(); }
    positionBox(box, crop);
    box.style.display = 'block';
    initRegionBox(clipId, 'shorts-crop-mobile-', '9:16', c => { cs.short.mobile = c; saveState(); });
  } else if (subMode === 'split') {
    if (!cs.short.split) {
      cs.short.split = {
        gameplay: { x: 0, y: 0, w: 100, h: 100 },
        webcam:   { x: 2, y: 2, w: 30, h: 30 },
        ratio: 0.7
      };
      saveState();
    }
    const gBox = document.getElementById('shorts-gameplay-' + clipId);
    const wBox = document.getElementById('shorts-webcam-' + clipId);
    if (gBox) { positionBox(gBox, cs.short.split.gameplay); gBox.style.display = 'block'; }
    if (wBox) { positionBox(wBox, cs.short.split.webcam);   wBox.style.display = 'block'; }
    initRegionBox(clipId, 'shorts-gameplay-', 'free', c => { if (cs.short.split) cs.short.split.gameplay = c; saveState(); drawSplitPreview(clipId); });
    initRegionBox(clipId, 'shorts-webcam-',   'free', c => { if (cs.short.split) cs.short.split.webcam = c;   saveState(); drawSplitPreview(clipId); });
    if (splitPreviewWrap) splitPreviewWrap.style.display = '';
    initSplitPreviewDrag(clipId);
    resizeSplitCanvas(clipId);
  }
}

function positionBox(box, crop) {
  box.style.left   = crop.x + '%';
  box.style.top    = crop.y + '%';
  box.style.width  = crop.w + '%';
  box.style.height = crop.h + '%';
}

function initRegionBox(clipId, prefix, ar, onSave) {
  const box = document.getElementById(prefix + clipId);
  if (!box || box.dataset.regionInited === ar) return;
  box.dataset.regionInited = ar;
  const wrap = box.parentElement;
  const AR_RATIO = ar === '16:9' ? 1 : ar === '9:16' ? 256/81 : null;

  function getCrop() {
    return { x: parseFloat(box.style.left)||0, y: parseFloat(box.style.top)||0,
             w: parseFloat(box.style.width)||100, h: parseFloat(box.style.height)||100 };
  }

  // Drag move
  box.addEventListener('mousedown', e => {
    if (e.target.classList.contains('rh')) return;
    e.preventDefault();
    const rect = wrap.getBoundingClientRect();
    const { x: cx, y: cy, w, h } = getCrop();
    const sx = e.clientX, sy = e.clientY;
    const onMove = e => {
      const dx = (e.clientX - sx) / rect.width * 100;
      const dy = (e.clientY - sy) / rect.height * 100;
      positionBox(box, { x: Math.max(0, Math.min(100-w, cx+dx)), y: Math.max(0, Math.min(100-h, cy+dy)), w, h });
    };
    const onUp = () => { document.removeEventListener('mousemove', onMove); document.removeEventListener('mouseup', onUp); onSave(getCrop()); };
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  });

  // Resize — all 4 corners
  box.querySelectorAll('.rh').forEach(handle => {
    const isTop  = handle.classList.contains('nw') || handle.classList.contains('ne');
    const isLeft = handle.classList.contains('nw') || handle.classList.contains('sw');
    handle.addEventListener('mousedown', e => {
      e.preventDefault(); e.stopPropagation();
      const rect = wrap.getBoundingClientRect();
      const { x: ox, y: oy, w: ow, h: oh } = getCrop();
      const anchorX = isLeft ? ox + ow : ox;
      const anchorY = isTop  ? oy + oh : oy;
      const sx = e.clientX, sy = e.clientY;
      const onMove = e => {
        const dx = (e.clientX - sx) / rect.width * 100;
        const dy = (e.clientY - sy) / rect.height * 100;
        let nx, ny, nw, nh;
        if (AR_RATIO !== null) {
          const rawW = isLeft ? ow - dx : ow + dx;
          nw = Math.max(10, rawW);
          nw = isLeft ? Math.min(anchorX, nw) : Math.min(100 - anchorX, nw);
          nh = nw * AR_RATIO;
          const maxH = isTop ? anchorY : 100 - anchorY;
          if (nh > maxH) { nh = maxH; nw = nh / AR_RATIO; }
          nx = isLeft ? anchorX - nw : anchorX;
          ny = isTop  ? anchorY - nh : anchorY;
        } else {
          nw = isLeft ? Math.max(10, Math.min(anchorX, ow - dx))       : Math.max(10, Math.min(100 - anchorX, ow + dx));
          nh = isTop  ? Math.max(10, Math.min(anchorY, oh - dy))       : Math.max(10, Math.min(100 - anchorY, oh + dy));
          nx = isLeft ? anchorX - nw : anchorX;
          ny = isTop  ? anchorY - nh : anchorY;
        }
        positionBox(box, { x: nx, y: ny, w: nw, h: nh });
      };
      const onUp = () => { document.removeEventListener('mousemove', onMove); document.removeEventListener('mouseup', onUp); onSave(getCrop()); };
      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onUp);
    });
  });
}

function resizeSplitCanvas(clipId) {
  const card = document.querySelector(`[data-clip-id="${clipId}"]`);
  if (!card) return;
  const outer = card.querySelector('.vid-outer-wrap');
  const canvas = document.getElementById('split-preview-' + clipId);
  if (!outer || !canvas) return;

  // Solve mathematically so layout never needs to re-settle:
  // outer_w = video_w + gap + canvas_w
  // video_h = video_w * 9/16  (aspect-ratio 16:9)
  // canvas_h = video_h         (equal heights)
  // canvas_w = canvas_h * 9/16 = video_w * (9/16)²
  // → video_w = (outer_w - gap) * 256 / 337
  const gap = 8;
  const outerW = outer.getBoundingClientRect().width;
  if (outerW < 50) return;
  const videoW = (outerW - gap) * 256 / 337;
  const canvasH = Math.round(videoW * 9 / 16);
  const canvasW = Math.round(canvasH * 9 / 16);

  canvas.style.height = canvasH + 'px';
  canvas.style.width  = canvasW + 'px';
  drawSplitPreview(clipId);
}

function initSplitPreviewDrag(clipId) {
  const canvas = document.getElementById('split-preview-' + clipId);
  if (!canvas || canvas.dataset.splitDragInited) return;
  canvas.dataset.splitDragInited = '1';
  canvas.addEventListener('mousedown', e => {
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    const onMove = e => {
      const cs = getClipState(clipId);
      if (!cs.short?.split) return;
      cs.short.split.ratio = Math.max(0.1, Math.min(0.9, 1 - (e.clientY - rect.top) / rect.height));
      saveState();
      drawSplitPreview(clipId);
    };
    const onUp = () => { document.removeEventListener('mousemove', onMove); document.removeEventListener('mouseup', onUp); };
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  });
}

function drawSplitPreview(clipId) {
  const canvas = document.getElementById('split-preview-' + clipId);
  const cs = getClipState(clipId);
  if (!canvas || !cs.short?.split) return;
  const vid = document.getElementById('vid-' + clipId);
  const ctx = canvas.getContext('2d');
  const PW = 108, PH = 192;
  const split = cs.short.split;
  const ratio = split.ratio ?? 0.7;
  const gameH = Math.round(PH * ratio);
  const camH = PH - gameH;

  ctx.fillStyle = '#080810';
  ctx.fillRect(0, 0, PW, PH);

  const hasVideo = vid && vid.readyState >= 2 && vid.videoWidth > 0;
  if (hasVideo) {
    const vw = vid.videoWidth, vh = vid.videoHeight;
    function drawRegion(crop, destY, destH) {
      const sx = crop.x/100 * vw, sy = crop.y/100 * vh;
      const sw = crop.w/100 * vw, sh = crop.h/100 * vh;
      if (sw > 0 && sh > 0) try { ctx.drawImage(vid, sx, sy, sw, sh, 0, destY, PW, destH); } catch {}
    }
    drawRegion(split.webcam, 0, camH);
    drawRegion(split.gameplay, camH, gameH);
  } else {
    ctx.fillStyle = '#1a0a1a'; ctx.fillRect(0, 0, PW, camH);
    ctx.fillStyle = '#0a0a1a'; ctx.fillRect(0, camH, PW, gameH);
    ctx.fillStyle = '#555'; ctx.font = '10px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('📷', PW/2, camH/2);
    ctx.fillText('🎮', PW/2, camH + gameH/2);
  }
  // Divider
  ctx.fillStyle = '#f5ff3d';
  ctx.fillRect(0, camH, PW, 2);
}

function togglePlay(clipId) {
  const video = document.getElementById('vid-' + clipId);
  if (!video) return;
  video.paused ? video.play() : video.pause();
}

function seekRel(clipId, delta) {
  const video = document.getElementById('vid-' + clipId);
  if (video) video.currentTime = Math.max(0, video.currentTime + delta);
}

// ── CUTS ──────────────────────────────────────────────────────────────────────
function parseMmSs(str) {
  const parts = str.trim().split(':');
  if (parts.length === 2) return parseFloat(parts[0]) * 60 + parseFloat(parts[1]);
  return parseFloat(str) || 0;
}

function addCut(clipId) {
  const clip = getClip(clipId);
  const cs = getClipState(clipId);
  const from = Math.max(0, parseMmSs(document.getElementById('cut-from-' + clipId).value));
  const to = Math.min(clip.duration, parseMmSs(document.getElementById('cut-to-' + clipId).value));
  if (to <= from) return;
  if (!cs.keeps) cs.keeps = [];
  cs.keeps.push([+from.toFixed(2), +to.toFixed(2)]);
  cs.keeps.sort((a, b) => a[0] - b[0]);
  saveState();
  renderCutZones(clipId, clip);
  updateCardInPlace(clipId);
}

function removeCut(clipId, idx) {
  const cs = getClipState(clipId);
  cs.keeps.splice(idx, 1);
  saveState();
  renderCutZones(clipId, getClip(clipId));
  updateCardInPlace(clipId);
}

function renderCutZones(clipId, clip) {
  const cs = getClipState(clipId);
  const track = document.getElementById('tl-' + clipId);
  if (!track) return;
  const reconTrack = document.getElementById('tl-recon-' + clipId);
  [track, reconTrack].forEach(t => {
    if (!t) return;
    t.querySelectorAll('.tl-cut-zone').forEach(el => el.remove());
    (cs.keeps || []).forEach(([from, to]) => {
      const zone = document.createElement('div');
      zone.className = 'tl-cut-zone';
      zone.style.left = (from / clip.duration * 100) + '%';
      zone.style.width = ((to - from) / clip.duration * 100) + '%';
      t.appendChild(zone);
    });
  });
  const list = document.getElementById('cuts-list-' + clipId);
  if (!list) return;
  list.innerHTML = '';
  (cs.keeps || []).forEach(([from, to], i) => {
    const row = document.createElement('div');
    row.className = 'ctrl-row';
    row.style.marginTop = '5px';
    row.innerHTML = `<span style="color:#f5ff3d;font-size:11px;font-family:monospace">🟡 ${fmtTime(from)} → ${fmtTime(to)}</span>
      <button class="ctrl-btn" style="padding:0;width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-size:13px;border-color:#f5ff3d22;color:#888;flex-shrink:0" onclick="removeCut('${clipId}',${i})">×</button>`;
    list.appendChild(row);
  });
}

function renderReconnectZone(clipId, clip) {
  const track = document.getElementById('tl-' + clipId);
  if (!track) return;
  track.querySelectorAll('.tl-recon-zone-src').forEach(el => el.remove());
  const src = state.reconnectSource;
  if (!src || src.clipId !== clipId || !clip) return;
  const zone = document.createElement('div');
  zone.className = 'tl-recon-zone-src';
  zone.style.left = (src.from / clip.duration * 100) + '%';
  zone.style.width = ((src.to - src.from) / clip.duration * 100) + '%';
  track.appendChild(zone);
}

function updateReconFillUI(clipId) {
  const clip = getClip(clipId);
  const src = state.reconnectSource;
  if (!clip || !src || src.clipId !== clipId) return;
  const fill = document.getElementById('tl-recon-fill-' + clipId);
  const handleIn = document.getElementById('tl-recon-in-' + clipId);
  const handleOut = document.getElementById('tl-recon-out-' + clipId);
  const timeIn = document.getElementById('tl-recon-time-in-' + clipId);
  const timeOut = document.getElementById('tl-recon-time-out-' + clipId);
  if (!fill) return;
  const fromPct = src.from / clip.duration * 100;
  const toPct = src.to / clip.duration * 100;
  fill.style.left = fromPct + '%';
  fill.style.right = (100 - toPct) + '%';
  handleIn.style.left = fromPct + '%';
  handleOut.style.right = (100 - toPct) + '%';
  if (timeIn) timeIn.textContent = 'from: ' + fmtTime(src.from);
  if (timeOut) timeOut.textContent = 'to: ' + fmtTime(src.to);
}

function setReconnectSource(clipId) {
  const clip = getClip(clipId);
  const cs = getClipState(clipId);
  const oldSrc = state.reconnectSource;

  if (state.reconnectSource?.clipId === clipId) {
    state.reconnectSource = null;
  } else {
    const from = +(cs.trimIn ?? 0).toFixed(2);
    const to = +Math.min((cs.trimOut ?? clip?.duration ?? 10), from + 3).toFixed(2);
    state.reconnectSource = { clipId, from, to };
  }

  if (oldSrc && oldSrc.clipId !== clipId) {
    renderReconnectZone(oldSrc.clipId, getClip(oldSrc.clipId));
    syncTagSections(oldSrc.clipId);
    updateCardInPlace(oldSrc.clipId);
  }
  renderReconnectZone(clipId, clip);
  const reconBtn = document.getElementById('recon-mode-btn-' + clipId);
  if (reconBtn) reconBtn.style.display = state.reconnectSource?.clipId === clipId ? '' : 'none';
  syncTagSections(clipId);
  updateCardInPlace(clipId);
  saveState();
  if (state.reconnectSource?.clipId === clipId && reconBtn) {
    setPlayMode(clipId, 'reconnect', reconBtn);
  }
}

function initReconTimeline(clipId) {
  const clip = getClip(clipId);
  const track = document.getElementById('tl-recon-' + clipId);
  if (!clip || !track) return;
  updateReconFillUI(clipId);
  if (track.dataset.reconInited) return;
  track.dataset.reconInited = '1';

  const fill = document.getElementById('tl-recon-fill-' + clipId);
  const handleIn = document.getElementById('tl-recon-in-' + clipId);
  const handleOut = document.getElementById('tl-recon-out-' + clipId);

  function liveUpdate() {
    updateReconFillUI(clipId);
    renderReconnectZone(clipId, clip);
    const src = state.reconnectSource;
    const detail = src
      ? `джерело: ${getClip(src.clipId)?.streamer || '?'} · ${fmtTime(src.from)} → ${fmtTime(src.to)}`
      : 'джерело не вибрано';
    document.querySelectorAll('[id^="recon-sep-detail-"]').forEach(el => el.textContent = detail);
    document.querySelectorAll('.recon-sep-standalone .recon-sep-detail').forEach(el => el.textContent = detail);
    const reconDisp = document.getElementById('reconnect-display');
    if (reconDisp && src) reconDisp.textContent = `${getClip(src.clipId)?.streamer || '?'} ${fmtTime(src.from)}–${fmtTime(src.to)}`;
    updateTimingExtras(clipId);
    const fromIn = document.getElementById('cut-from-' + clipId);
    const toIn = document.getElementById('cut-to-' + clipId);
    if (src && fromIn) fromIn.value = fmtTime(src.from);
    if (src && toIn) toIn.value = fmtTime(src.to);
  }

  function makeHandle(handle, type) {
    handle.addEventListener('mousedown', e => {
      e.preventDefault();
      e.stopPropagation();
      const rect = track.getBoundingClientRect();
      const onMove = e => {
        const src = state.reconnectSource;
        if (!src || src.clipId !== clipId) return;
        const pct = Math.max(0, Math.min(100, (e.clientX - rect.left) / rect.width * 100));
        const sec = +(pct / 100 * clip.duration).toFixed(2);
        if (type === 'in') {
          src.from = Math.min(sec, src.to - 0.5);
          const v = document.getElementById('vid-' + clipId);
          if (v) v.currentTime = src.from;
        } else {
          src.to = Math.max(sec, src.from + 0.5);
          const v = document.getElementById('vid-' + clipId);
          if (v) v.currentTime = src.to;
        }
        liveUpdate();
      };
      const onUp = () => {
        document.removeEventListener('mousemove', onMove);
        document.removeEventListener('mouseup', onUp);
        saveState();
      };
      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onUp);
    });
  }

  fill.addEventListener('mousedown', e => {
    if (e.target === handleIn || e.target === handleOut) return;
    e.preventDefault();
    const src = state.reconnectSource;
    if (!src || src.clipId !== clipId) return;
    const rect = track.getBoundingClientRect();
    const width = src.to - src.from;
    const startX = e.clientX;
    const startFrom = src.from;
    fill.style.cursor = 'grabbing';
    const onMove = ev => {
      const srcNow = state.reconnectSource;
      if (!srcNow || srcNow.clipId !== clipId) return;
      const delta = (ev.clientX - startX) / rect.width * clip.duration;
      srcNow.from = Math.max(0, Math.min(clip.duration - width, startFrom + delta));
      srcNow.to = srcNow.from + width;
      liveUpdate();
    };
    const onUp = () => {
      fill.style.cursor = 'grab';
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
      saveState();
    };
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  });

  makeHandle(handleIn, 'in');
  makeHandle(handleOut, 'out');

  const video = document.getElementById('vid-' + clipId);
  if (video) {
    video.addEventListener('timeupdate', () => {
      const ph = document.getElementById('tl-recon-ph-' + clipId);
      if (ph) ph.style.left = (video.currentTime / clip.duration * 100) + '%';
    });
  }

  track.addEventListener('click', e => {
    if (e.target === handleIn || e.target === handleOut || e.target === fill) return;
    const rect = track.getBoundingClientRect();
    const pct = (e.clientX - rect.left) / rect.width;
    const v = document.getElementById('vid-' + clipId);
    if (v) v.currentTime = pct * clip.duration;
  });
}

function syncTagSections(clipId) {
  const cs = getClipState(clipId);
  const isThumb = isThumbClip(clipId);
  const isShort = !!cs.short;
  const reconModeBtn = document.getElementById('recon-mode-btn-' + clipId);
  if (reconModeBtn) reconModeBtn.style.display = (state.reconnectSource?.clipId === clipId) ? '' : 'none';
  const thumbModeBtn = document.getElementById('thumb-mode-btn-' + clipId);
  if (thumbModeBtn) thumbModeBtn.style.display = isThumb ? '' : 'none';
  const shortsModeBtn = document.getElementById('shorts-mode-btn-' + clipId);
  if (shortsModeBtn) shortsModeBtn.style.display = isShort ? '' : 'none';
  updateThumbMark(clipId);
}

function updateThumbMark(clipId) {
  const clip = getClip(clipId);
  const entry = getThumbEntry(clipId);
  ['tl-thumb-mark-', 'tl-recon-thumb-mark-'].forEach(prefix => {
    const mark = document.getElementById(prefix + clipId);
    if (!mark) return;
    if (entry && clip) {
      mark.style.left = (entry.at / clip.duration * 100) + '%';
      mark.style.display = 'block';
    } else {
      mark.style.display = 'none';
    }
  });
}

// ── BENCH ─────────────────────────────────────────────────────────────────────
function renderBench() {
  const bench = CLIPS_DATA.bench;
  document.getElementById('bench-label').textContent = `Bench — ще ${bench.length} кліпів`;
  const body = document.getElementById('bench-body');
  body.innerHTML = '';
  const cats = {};
  bench.forEach(clip => {
    if (!cats[clip.category]) cats[clip.category] = [];
    cats[clip.category].push(clip);
  });
  Object.entries(cats).sort((a,b) => a[0].localeCompare(b[0])).forEach(([cat, clips]) => {
    const catEl = document.createElement('div');
    catEl.className = 'bench-cat';
    const safeId = cat.replace(/\W/g,'_');
    catEl.innerHTML = `<div class="bench-cat-title">${cat} (${clips.length})</div>
      <div class="bench-cards" id="bench-cat-${safeId}"></div>`;
    body.appendChild(catEl);
    const cardsEl = catEl.querySelector('.bench-cards');
    clips.sort((a,b) => b.viewCount - a.viewCount).forEach(clip => cardsEl.appendChild(buildBenchCard(clip)));
  });
}

function buildBenchCard(clip) {
  const card = document.createElement('div');
  card.className = 'bench-card';
  card.dataset.clipId = clip.id;
  card.innerHTML = `
    <span class="bench-streamer">${clip.streamer}</span>
    <span class="bench-dur">${fmtTimeSec(clip.duration)}</span>
    <button class="bench-add" onclick="addFromBench('${clip.id}')">+</button>`;
  return card;
}

function addFromBench(clipId) {
  if (state.order.includes(clipId)) return;
  state.order.push(clipId);
  const idx = CLIPS_DATA.bench.findIndex(c => c.id === clipId);
  if (idx !== -1) { CLIPS_DATA.selected.push(CLIPS_DATA.bench.splice(idx, 1)[0]); }
  if (!state.benched) state.benched = [];
  state.benched = state.benched.filter(id => id !== clipId);
  saveState();
  renderClipList();
  renderBench();
}

function sendToBench(e, clipId) {
  e.stopPropagation();
  state.order = state.order.filter(id => id !== clipId);
  delete state.reconnects[clipId];
  if (state.reconnectSource?.clipId === clipId) state.reconnectSource = null;
  const removedThumb = getThumbEntry(clipId);
  state.thumbnails = (state.thumbnails || []).filter(t => t.clipId !== clipId);
  if (removedThumb?.main && state.thumbnails.length > 0) state.thumbnails[0].main = true;
  const idx = CLIPS_DATA.selected.findIndex(c => c.id === clipId);
  if (idx !== -1) CLIPS_DATA.bench.push(CLIPS_DATA.selected.splice(idx, 1)[0]);
  if (!state.benched) state.benched = [];
  if (!state.benched.includes(clipId)) state.benched.push(clipId);
  saveState();
  renderClipList();
  renderBench();
  updateDuration();
}

function addStandaloneRecon() {
  state.order.unshift('__recon_' + Date.now());
  saveState();
  renderClipList();
}

function removeStandaloneRecon(reconId) {
  state.order = state.order.filter(id => id !== reconId);
  saveState();
  renderClipList();
}

function toggleBench(btn) {
  const body = document.getElementById('bench-body');
  const isOpen = body.classList.contains('open');
  body.classList.toggle('open', !isOpen);
  document.getElementById('bench-arrow').textContent = isOpen ? '▶' : '▼';
}

// ── TOPBAR ────────────────────────────────────────────────────────────────────
function updateTopbar() {
  const clipCount = state.order.filter(id => !id.startsWith('__recon_')).length;
  document.getElementById('count-display').textContent =
    clipCount + ' / ' + (CLIPS_DATA.selected.length + CLIPS_DATA.bench.length);
  const shortCount = state.order.filter(id => !id.startsWith('__recon_') && !!state.clips[id]?.short).length;
  document.getElementById('shorts-display').textContent = shortCount;
  const reconBadge = document.getElementById('reconnect-badge');
  if (state.reconnectSource) {
    reconBadge.style.display = '';
    const src = state.reconnectSource;
    document.getElementById('reconnect-display').textContent =
      `${getClip(src.clipId)?.streamer || '?'} ${fmtTime(src.from)}–${fmtTime(src.to)}`;
  } else { reconBadge.style.display = 'none'; }
  const thumbBadge = document.getElementById('thumb-badge');
  if (state.thumbnails && state.thumbnails.length > 0) {
    thumbBadge.style.display = '';
    document.getElementById('thumb-display').textContent =
      state.thumbnails.map(t => getClip(t.clipId)?.streamer || '?').join(', ');
  } else { thumbBadge.style.display = 'none'; }
}

function updateDuration() {
  let total = 1.25 + 1.25;
  const clipOrder = state.order.filter(id => !id.startsWith('__recon_'));
  const reconCount = Math.max(0, Math.floor(clipOrder.length / 3) - 1);
  total += reconCount;
  clipOrder.forEach(clipId => {
    const clip = getClip(clipId);
    const cs = state.clips[clipId] || {};
    if (!clip) return;
    const keeps = cs.keeps;
    if (keeps && keeps.length > 0) {
      keeps.forEach(([from, to]) => { total += Math.max(0, to - from); });
    } else {
      total += clip.duration;
    }
  });
  const m = Math.floor(total / 60);
  const s = Math.round(total % 60).toString().padStart(2, '0');
  document.getElementById('dur-display').textContent = `~${m}:${s}`;
}

// ── JSON GENERATOR ────────────────────────────────────────────────────────────
function buildJSON() {
  const src = state.reconnectSource;
  const reconnectPositions = Object.keys(state.reconnects || {}).filter(id => state.order.includes(id));
  const out = {
    runId: CLIPS_DATA.runId,
    clipOrder: state.order.map(id => id.startsWith('__recon_') ? '__recon' : id),
    reconnectSource: src ? { clipId: src.clipId, from: +src.from.toFixed(2), to: +src.to.toFixed(2) } : null,
    reconnectPositions,
    thumbnails: state.thumbnails || [],
    clips: {}
  };
  state.order.forEach(id => {
    if (id.startsWith('__recon_')) return;
    const cs = state.clips[id] || {};
    const entry = {};
    if (cs.keeps && cs.keeps.length > 0) entry.keeps = cs.keeps;
    if (cs.short) entry.short = cs.short;
    if (Object.keys(entry).length > 0) out.clips[id] = entry;
  });
  return out;
}

function updatePrompt() {
  document.getElementById('prompt-code').textContent = JSON.stringify(buildJSON(), null, 2);
}

function copyPrompt() {
  const json = buildJSON();
  const text = `/resume\n\n${JSON.stringify(json)}`;
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.getElementById('btn-copy-json');
    btn.textContent = '✓ Copied';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = '📋 Copy JSON'; btn.classList.remove('copied'); }, 2000);
  });
}
