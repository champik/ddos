<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>DDOS Thumbnail</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=JetBrains+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #0e0e10;
        font-family: 'Anton', sans-serif;
      }

      #frame {
        position: absolute;
        inset: 0;
      }

      #bg {
        position: absolute;
        inset: 0;
        background-size: cover;
        background-position: center;
        background-color: #1a1a1e;
      }

      .ct {
        position: absolute;
        left: 0;
        right: 0;
        height: 16px;
        z-index: 10;
        background: repeating-linear-gradient(-45deg, #f5ff3d 0 16px, #0e0e10 16px 32px);
      }
      .ct-top    { top: 0; }
      .ct-bottom { bottom: 0; }

      #va {
        position: absolute;
        inset: 0;
        display: none;
      }

      #va .grad {
        position: absolute;
        inset: 0;
        background: linear-gradient(
          180deg,
          rgba(14, 14, 16, 0)    0%,
          rgba(14, 14, 16, 0.1)  30%,
          rgba(14, 14, 16, 0.65) 62%,
          rgba(14, 14, 16, 0.95) 100%
        );
      }

      #twitch-badge {
        position: absolute;
        top: 0;
        right: 0;
        z-index: 20;
        filter: drop-shadow(0 4px 12px rgba(0,0,0,0.7));
      }

      #va .headline {
        position: absolute;
        left: 40px;
        bottom: 52px;
        right: 40px;
        z-index: 12;
        font-family: 'Anton', sans-serif;
        letter-spacing: -3px;
        line-height: 0.88;
        color: #f4f0e6;
        text-shadow:
          5px 5px 0 rgba(14, 14, 16, 0.9),
          0 0 40px rgba(14, 14, 16, 0.5);
      }
    </style>
  </head>
  <body>
    <div id="frame">
      <div id="bg"></div>
      <div class="ct ct-top"></div>
      <div class="ct ct-bottom"></div>

      <div id="twitch-badge">
        <svg style="transform:scaleX(-1)" width="250" height="250" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
          <polygon points="13 8 8 13 8 31 14 31 14 36 19 31 23 31 32 22 32 8" fill="#9146ff"/>
          <polygon points="26 25 30 21 30 10 14 10 14 25 18 25 18 29 22 25" fill="#ffffff"/>
          <path d="M20,14 L22,14 L22,20 L20,20 L20,14 Z M27,14 L27,20 L25,20 L25,14 L27,14 Z" fill="#9146ff"/>
        </svg>
      </div>

      <div id="va">
        <div class="grad"></div>
        <div class="headline" id="va-hl">HE LANDED IT</div>
      </div>
    </div>

    <script>
      var THUMB_CONFIG = {
        headline: 'HE LANDED IT',
        img: '',
        fontSize: null,
        crop: null,  // { x, y, w, h } as % of frame, 16:9 locked
      };

      function hlSize(len) {
        if (len <= 8)  return 320;
        if (len >= 20) return 135;
        return Math.round(320 - ((320 - 135) * (len - 8)) / 12);
      }

      function renderThumb() {
        var c = THUMB_CONFIG;
        var hl = (c.headline || '').toUpperCase();

        if (c.img) {
          var bg = document.getElementById('bg');
          bg.style.backgroundImage = "url('" + c.img + "')";
          if (c.crop && c.crop.w < 99) {
            var imgW = 1920 / (c.crop.w / 100);
            var imgH = 1080 / (c.crop.h / 100);
            var offX = -(c.crop.x / 100) * imgW;
            var offY = -(c.crop.y / 100) * imgH;
            bg.style.backgroundSize = imgW + 'px ' + imgH + 'px';
            bg.style.backgroundPosition = offX + 'px ' + offY + 'px';
          }
        }

        if (hl) {
          var el = document.getElementById('va');
          el.style.display = 'block';
          var hlEl = document.getElementById('va-hl');
          hlEl.textContent = hl;
          hlEl.style.fontSize = (c.fontSize || hlSize(hl.length)) + 'px';
        }
      }

      renderThumb();
    </script>
  </body>
</html>
