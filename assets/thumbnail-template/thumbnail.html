<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>DDOS Thumbnail</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=JetBrains+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #0e0e10;
        font-family: 'Anton', sans-serif;
      }

      #frame {
        position: absolute;
        inset: 0;
      }

      #bg {
        position: absolute;
        inset: 0;
        background-size: cover;
        background-position: center;
        background-color: #1a1a1e;
      }

      .ct {
        position: absolute;
        left: 0;
        right: 0;
        height: 16px;
        z-index: 10;
        background: repeating-linear-gradient(-45deg, #f5ff3d 0 16px, #0e0e10 16px 32px);
      }
      .ct-top    { top: 0; }
      .ct-bottom { bottom: 0; }

      #va {
        position: absolute;
        inset: 0;
        display: none;
      }

      #va .grad {
        position: absolute;
        inset: 0;
        background: linear-gradient(
          180deg,
          rgba(14, 14, 16, 0)    0%,
          rgba(14, 14, 16, 0.1)  30%,
          rgba(14, 14, 16, 0.65) 62%,
          rgba(14, 14, 16, 0.95) 100%
        );
      }

      #va .headline {
        position: absolute;
        left: 40px;
        bottom: 52px;
        right: 40px;
        z-index: 12;
        font-family: 'Anton', sans-serif;
        letter-spacing: -3px;
        line-height: 0.88;
        color: #f4f0e6;
        text-shadow:
          5px 5px 0 rgba(14, 14, 16, 0.9),
          0 0 40px rgba(14, 14, 16, 0.5);
      }
    </style>
  </head>
  <body>
    <div id="frame">
      <div id="bg"></div>
      <div class="ct ct-top"></div>
      <div class="ct ct-bottom"></div>

      <div id="va">
        <div class="grad"></div>
        <div class="headline" id="va-hl">HE LANDED IT</div>
      </div>
    </div>

    <script>
      var THUMB_CONFIG = {
        headline: 'HE LANDED IT',
        img: '',
        fontSize: null,  // optional override in px
      };

      function hlSize(len) {
        if (len <= 8)  return 320;
        if (len >= 20) return 135;
        return Math.round(320 - ((320 - 135) * (len - 8)) / 12);
      }

      function renderThumb() {
        var c = THUMB_CONFIG;
        var hl = (c.headline || '').toUpperCase();

        if (c.img) {
          document.getElementById('bg').style.backgroundImage = "url('" + c.img + "')";
        }

        var el = document.getElementById('va');
        el.style.display = 'block';

        var hlEl = document.getElementById('va-hl');
        hlEl.textContent = hl;
        hlEl.style.fontSize = (c.fontSize || hlSize(hl.length)) + 'px';
      }

      renderThumb();
    </script>
  </body>
</html>
